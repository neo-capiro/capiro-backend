# Source-only CodeBuild recipe for one frozen integrated Core image.
# The reviewed project configuration pins APPROVED_SOURCE_SHA,
# APPROVED_ARCHIVE_SHA256, APPROVED_SOURCE_BUCKET and
# APPROVED_SOURCE_VERSION_ID to an exact versioned Git archive ZIP. Read back
# that configuration before a build. No StartBuild overrides.
version: 0.2
env:
  shell: bash
  variables:
    DOCKER_BUILDKIT: "1"
phases:
  build:
    commands:
      - |
        set -euo pipefail
        stage=initialize
        trap 'printf "BLOCK: Core build stage %s failed\n" "$stage" >&2' ERR
        REPOSITORY=capiro/preview-core
        REGISTRY=967807252336.dkr.ecr.us-east-1.amazonaws.com
        stage=architecture
        test "$(uname -m)" = aarch64
        stage=region
        test "${AWS_REGION:-${AWS_DEFAULT_REGION:-}}" = us-east-1
        stage=account
        test "$(aws sts get-caller-identity --query Account --output text)" = 967807252336
        # CodeBuild's source URL metadata is not used as build input. The
        # versioned S3 download and full archive hash below select the bytes.
        stage=source-pin
        SOURCE_SHA="${APPROVED_SOURCE_SHA:?}"
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        SOURCE_KEY="inputs/core-$SOURCE_SHA.zip"
        ARCHIVE_SHA256="${APPROVED_ARCHIVE_SHA256:?}"
        [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
        test "${APPROVED_SOURCE_BUCKET:?}" = capiro-portfolio-preview-source-967807252336-us-east-1
        [[ "${APPROVED_SOURCE_VERSION_ID:?}" =~ ^[A-Za-z0-9._+/=-]{1,255}$ ]]
        IMAGE="$REGISTRY/$REPOSITORY:$SOURCE_SHA"
        stage=source-version
        test "${CODEBUILD_SOURCE_VERSION:-}" = "${APPROVED_SOURCE_VERSION_ID:?}"
        stage=resolved-source-version
        test -z "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}"
        stage=repository-mutability
        test "$(aws ecr describe-repositories --repository-names "$REPOSITORY" --query 'repositories[0].imageTagMutability' --output text)" = IMMUTABLE
        stage=existing-image-tag
        existing="$(aws ecr describe-images --repository-name "$REPOSITORY" --filter tagStatus=TAGGED --query "imageDetails[?contains(imageTags, '$SOURCE_SHA')].imageDigest" --output text)"
        test -z "$existing"
        stage=unzip-availability
        command -v unzip >/dev/null
        mkdir -p "$CODEBUILD_SRC_DIR/verified"
        stage=pinned-source-download
        observed_version="$(aws s3api get-object --bucket "$APPROVED_SOURCE_BUCKET" --key "$SOURCE_KEY" --version-id "$APPROVED_SOURCE_VERSION_ID" "$CODEBUILD_SRC_DIR/pinned-source.zip" --query VersionId --output text)"
        stage=pinned-source-version
        test "$observed_version" = "$APPROVED_SOURCE_VERSION_ID"
        stage=pinned-source-checksum
        printf '%s  %s\n' "$ARCHIVE_SHA256" "$CODEBUILD_SRC_DIR/pinned-source.zip" | sha256sum -c -
        stage=source-extract
        unzip -q "$CODEBUILD_SRC_DIR/pinned-source.zip" -d "$CODEBUILD_SRC_DIR/verified"
        cd "$CODEBUILD_SRC_DIR/verified"
        stage=receipt-migration-presence
        test -f apps/api/prisma/migrations/20281016020000_clio_conversation_bootstrap_receipts/migration.sql
        stage=integrated-source-presence
        test -f apps/api/prisma/reserved-migrations/20281018060000_meri_read_delegation/migration.sql
        test -f apps/api/src/meri/execution-capability/meri-execution-receiver.service.ts
        stage=reviewed-stage1-migration
        printf '%s  %s\n' \
          'f9d2f4a13474a1af97afdd9b5b8587a6e27e90a36d07fdd1e6f30344bb595c51' \
          apps/api/prisma/migrations/20281018090000_clio_meri_memory_submissions_content_free/migration.sql \
          | sha256sum -c -
        stage=held-helper-migration-absence
        test ! -e apps/api/prisma/migrations/20281018100000_meri_memory_eligibility_helper
        stage=ecr-login
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"
        stage=docker-build
        docker build --pull --platform linux/arm64 --target runtime \
          --label "org.opencontainers.image.revision=$SOURCE_SHA" \
          --label org.opencontainers.image.source=https://github.com/neo-capiro/capiro-backend \
          -f apps/api/Dockerfile.alpine-qualification -t "$IMAGE" .
        stage=image-architecture
        test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = arm64
        stage=runtime-smoke
        sh apps/api/scripts/qualification/run-alpine-runtime-probes.sh "$IMAGE"
        stage=docker-push
        docker push "$IMAGE"
        stage=registry-digest
        digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$SOURCE_SHA" --query 'imageDetails[0].imageDigest' --output text)"
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        stage=local-digest-match
        docker image inspect "$IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Fx "$REGISTRY/$REPOSITORY@$digest"
        printf 'source=%s s3Version=%s archiveSha256=%s imageDigest=%s\n' "$SOURCE_SHA" "$observed_version" "$ARCHIVE_SHA256" "$digest"
