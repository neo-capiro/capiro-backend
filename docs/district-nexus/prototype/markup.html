  box-shadow:var(--shadow-2);padding:10px 12px;min-width:196px;pointer-events:none;font-size:12.5px}
.hovcard .hk{font-family:var(--font-mono);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
.hovcard .hm{color:var(--ink-3);font-size:11.5px;margin-top:2px}
.hovcard .hr{display:flex;justify-content:space-between;gap:16px;margin-top:6px;font-size:11.5px}
.hovcard .hr span{color:var(--ink-3)}
.hovcard .hr b{font-family:var(--font-mono);font-weight:600}

/* â”€â”€ right rail â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.rail{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);box-shadow:var(--shadow-1);
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.findings{border-bottom:1px solid var(--border-1);flex:0 1 auto;min-height:0;background:var(--bg-surface-2);display:flex;flex-direction:column;max-height:46%}
.findings .fh{display:flex;align-items:center;gap:8px;padding:11px 14px 9px;font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);user-select:none;flex:none}
.findings .fh .cnt{font-family:var(--font-mono);background:var(--notable-soft);color:var(--notable);border-radius:999px;padding:0 7px;font-size:10.5px;font-weight:700;letter-spacing:0}
.findings .fh .cv{margin-left:auto;color:var(--ink-4)}
.findings.cl .fh .cv{transform:rotate(-90deg)}
.findings.cl .fl{display:none}
.fl{padding:0 8px 9px;overflow-y:auto;min-height:0}
.fi{display:flex;gap:9px;padding:8px 8px 9px;border-radius:var(--r-sm);cursor:pointer;align-items:flex-start}
.fi:hover{background:var(--bg-sunken)}
.fi .fd{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:none}
.fi .tx{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.fi .tx em{font-style:normal;font-weight:700;color:var(--ink-1)}
.fi .act{font-size:11.5px;color:var(--accent-ink);margin-top:3px;display:flex;align-items:center;gap:4px;font-weight:600}
.fi:hover .act{text-decoration:underline}

.lhead{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border-1);flex:none}
.lhead .t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.lhead .c{font-family:var(--font-mono);color:var(--ink-2);font-weight:700;letter-spacing:0}
.lhead .so{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.dlist{flex:1 1 0;overflow-y:auto;min-height:64px}
.drow{padding:10px 14px 11px;border-bottom:1px solid var(--border-1);cursor:pointer;position:relative}
.drow:hover{background:var(--bg-surface-2)}
.drow.hl{background:var(--bg-sunken)}
.drow.sel{background:var(--accent-soft);box-shadow:inset 2.5px 0 0 var(--accent)}
.drow .r1{display:flex;align-items:baseline;gap:9px}
.drow .dk{font-family:var(--font-mono);font-weight:700;font-size:13.5px;letter-spacing:-.02em}
.drow .dm{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.drow .band{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;flex:none}
.drow .r2{display:flex;align-items:center;gap:9px;margin-top:7px}
.ebar{height:6px;border-radius:3px;background:var(--bg-sunken);display:flex;overflow:hidden;flex:1;min-width:0}
.ebar i{display:block;height:100%}
.drow .sc{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--ink-2);flex:none;width:22px;text-align:right}
.drow .r3{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.drow .r4{display:flex;gap:14px;margin-top:7px;font-size:11.5px;color:var(--ink-2)}
.drow .r4 span{color:var(--ink-3)}
.drow .r4 b{font-family:var(--font-mono);font-weight:600}

.ec{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:3px;
  white-space:nowrap;border:1px solid var(--border-1);background:var(--bg-surface);color:var(--ink-2)}
.ec .d{width:5px;height:5px;border-radius:50%;flex:none;background:var(--accent)}
.ec.w{border-style:dashed;border-color:var(--border-2);color:var(--ink-3);background:var(--bg-surface-2)}
.ec.w .d{background:transparent;border:1.2px solid var(--ink-4);width:6px;height:6px}

.rfoot{border-top:1px solid var(--border-1);padding:10px 14px;flex:none;display:flex;align-items:center;gap:9px;background:var(--notable-soft);cursor:pointer}
.rfoot:hover{filter:brightness(.985)}
.rfoot .tt{font-size:12.5px;color:#6f470d}
.rfoot .tt b{font-family:var(--font-mono);font-weight:700}
.rfoot .ar{margin-left:auto;color:var(--notable)}

/* â”€â”€ drawer â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.veil{position:fixed;inset:0;z-index:1100;background:rgba(12,26,56,.32);display:none}
.veil.on{display:block}
.drawer{position:fixed;top:0;right:-660px;bottom:0;z-index:1150;width:620px;max-width:calc(100vw - 60px);
  background:var(--bg-surface);border-left:1px solid var(--border-1);box-shadow:-18px 0 50px rgba(12,26,56,.18);
  display:flex;flex-direction:column}
.drawer.on{right:0}
.dr-head{padding:15px 18px 14px;border-bottom:1px solid var(--border-1);flex:none}
.dr-kicker{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.dr-head .l1{display:flex;align-items:center;gap:11px;margin-top:4px}
.dr-head h2{margin:0;font-family:var(--font-mono);font-size:21px;font-weight:700;letter-spacing:-.02em}
.dr-head h2.plain{font-family:var(--font-serif);font-weight:600;font-size:23px;letter-spacing:-.01em}
.dr-head .nmx{font-size:13px;color:var(--ink-3)}
.dr-x{margin-left:auto;width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--border-1);background:var(--bg-surface);color:var(--ink-3);display:grid;place-items:center;flex-shrink:0}
.dr-x:hover{background:var(--bg-sunken);color:var(--ink-1)}
.dr-head .l2{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.dr-head .l3{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.dr-body{flex:1;overflow-y:auto;min-height:0}
.sec{border-bottom:1px solid var(--border-1)}
.sec>.sh{display:flex;align-items:center;gap:9px;padding:12px 18px;cursor:pointer;user-select:none}
.sec>.sh:hover{background:var(--bg-surface-2)}
.sec>.sh .st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.sec>.sh .sm{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);font-weight:600}
.sec>.sh .cv{margin-left:auto;color:var(--ink-4)}
.sec.cl>.sh .cv{transform:rotate(-90deg)}
.sec.cl>.sb{display:none}
.sec>.sb{padding:0 18px 16px}

.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink-1)}
.kv dd .n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.mem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-1)}
.mem:last-child{border-bottom:0}
.mem .pty{width:20px;height:20px;border-radius:var(--r-xs);display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:none}
.mem .pty.D{background:var(--info-soft);color:var(--info)}
.mem .pty.R{background:var(--critical-soft);color:var(--critical)}
.mem .pty.I{background:var(--success-soft);color:var(--success)}
.mem .nm{font-size:13px;font-weight:600}
.mem .ro{font-size:11.5px;color:var(--ink-3)}
.mem .rt{margin-left:auto}

.htable{width:100%;border-collapse:collapse;font-size:12.5px}
.htable th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  padding:9px 10px;border-bottom:1px solid var(--border-1);background:var(--bg-surface-2);white-space:nowrap}
.htable td{padding:10px;border-bottom:1px solid var(--border-1);vertical-align:top}
.htable tr:last-child td{border-bottom:none}
.htable td.n,.htable th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.htable td.n{font-family:var(--font-mono)}
.htable tbody tr:hover{background:var(--bg-surface-2)}
.htable .sub{font-size:11px;color:var(--ink-3);font-family:var(--font-sans)}
.tblwrap{border:1px solid var(--border-1);border-radius:var(--r-md);overflow:hidden}

.bkd .br{display:grid;grid-template-columns:1fr 56px 42px;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid var(--border-1);font-size:12.5px}
.bkd .br:last-child{border-bottom:0}
.bkd .bl{display:flex;align-items:center;gap:8px;min-width:0}
.bkd .bl .sw{width:8px;height:8px;border-radius:2px;flex:none}
.bkd .bl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkd .bw{height:6px;background:var(--bg-sunken);border-radius:3px;overflow:hidden}
.bkd .bw i{display:block;height:100%;border-radius:3px}
.bkd .bv{text-align:right;font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.bkd .br.z .bl{color:var(--ink-3)}
.bkd .br.z .bv{color:var(--ink-4)}

.hint{display:flex;gap:10px;border-radius:var(--r-md);padding:11px 13px;font-size:12.5px;line-height:1.5;align-items:flex-start;
  background:var(--bg-surface-2);border:1px solid var(--border-1);color:var(--ink-2)}
.hint b{color:var(--ink-1);font-weight:700}
.hint .hico{flex:none;margin-top:1px;color:var(--accent)}
.hint.notable{background:var(--notable-soft);border-color:#e6d09a;color:#6f470d}
.hint.notable b,.hint.notable .hico{color:#5c3a09}
.hint.info{background:var(--info-soft);border-color:#c3d2f4;color:#1d3f96}
.hint.info b,.hint.info .hico{color:#16327a}
.hint.critical{background:var(--critical-soft);border-color:#eec4b8;color:#7f2113}
.hint.critical b,.hint.critical .hico{color:#7f2113}
.hint+.hint{margin-top:8px}

.prov{font-size:11px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:9px;
  padding-top:8px;border-top:1px solid var(--border-1)}
.prov b{font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.oppcard{border:1px dashed var(--border-2);border-radius:var(--r-md);padding:11px 13px;background:var(--bg-surface-2)}
.oppcard+.oppcard{margin-top:9px}
.oppcard .ot{font-size:13px;font-weight:600;line-height:1.4}
.oppcard .om{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sig{font-size:11.5px;color:var(--ink-2);display:flex;gap:7px;align-items:flex-start;margin-top:4px}
.sig .b{color:var(--ink-4);flex:none}

/* â”€â”€ empty / skeleton â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.guide{text-align:center;padding:48px 28px;background:var(--bg-surface);border:1px solid var(--border-1);border-radius:var(--r-lg);max-width:620px;margin:0 auto}
.guide .gico{width:48px;height:48px;border-radius:50%;margin:0 auto 14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
.guide h4{margin:0 0 7px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.guide p{margin:0 auto 18px;font-size:13.5px;color:var(--ink-3);max-width:52ch;line-height:1.6}
.guide .row{display:inline-flex;gap:10px}
.skel{border-radius:var(--r-md);background:linear-gradient(90deg,var(--bg-sunken) 25%,#f7f4ed 40%,var(--bg-sunken) 60%);background-size:300% 100%;animation:dn-skel 1.2s infinite linear}
@keyframes dn-skel{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* â”€â”€ toasts â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
#toastw{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:1300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:10px;background:var(--bg-dark);color:var(--ink-on-dark);border-radius:999px;
  padding:10px 18px 10px 14px;font-size:12.5px;font-weight:500;box-shadow:0 12px 34px rgba(12,26,56,.32);max-width:560px}
.toast .tsub{font-family:var(--font-mono);font-size:11px;color:var(--ink-on-dark-2)}

/* â”€â”€ states inspector â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
#insp{position:fixed;right:16px;bottom:16px;z-index:2000}
#insp .tg{display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;background:var(--bg-dark);color:var(--ink-on-dark);
  border:0;border-radius:999px;box-shadow:0 8px 24px rgba(12,26,56,.28);font-size:12.5px;font-weight:600}
#insp .tg:hover{background:var(--bg-dark-2)}
#insp .pn{position:absolute;right:0;bottom:40px;width:296px;background:var(--bg-surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);border:1px solid var(--border-1);overflow:hidden;display:none}
#insp.on .pn{display:block}
#insp .pn h4{margin:0;padding:12px 14px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border-bottom:1px solid var(--border-1)}
#insp .pn .note{padding:9px 14px;font-size:11.5px;color:var(--ink-3);line-height:1.5;border-bottom:1px solid var(--border-1);background:var(--bg-surface-2)}
#insp .pn .li{padding:5px}
#insp .si{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:var(--r-sm);cursor:pointer}
#insp .si:hover{background:var(--bg-sunken)}
#insp .si.on{background:var(--accent-soft)}
#insp .si .rd{width:13px;height:13px;border:1px solid var(--border-2);border-radius:50%;flex:none;margin-top:2px;display:grid;place-items:center;background:#fff}
#insp .si.on .rd{border-color:var(--accent)}
#insp .si.on .rd::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
#insp .si .n{font-size:12.5px;font-weight:500}
#insp .si .d{font-size:11px;color:var(--ink-3);line-height:1.4}
</style>
</head>
