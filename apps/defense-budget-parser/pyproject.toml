[project]
name = "capiro-defense-budget-parser"
version = "0.1.0"
description = "Isolated Python parser runtime for defense-budget PDFs"
requires-python = ">=3.11,<3.13"
license = { text = "UNLICENSED" }

dependencies = [
    "pydantic>=2.7,<3",
    "pdfplumber>=0.11,<0.13",
    "pypdf>=4.0,<6",
]

[project.optional-dependencies]
camelot = [
    "camelot-py[cv]>=0.11,<0.13",
    "opencv-python-headless>=4.8,<5",
]
docling = [
    "docling>=2.5,<3",
]
ocr = [
    "paddleocr>=2.7,<3",
    "paddlepaddle>=2.6,<3",
    # paddlepaddle's cpp_extension module imports setuptools directly but
    # does not declare it as a dependency; Python no longer bundles
    # setuptools by default, so the ocr extra must pull it in explicitly.
    "setuptools",
    # Phase 10B-23B: page rasterization for paddleocr_engine.py. Declared
    # explicitly rather than relying on it arriving transitively (it
    # previously did, incidentally, through paddleocr/paddlepaddle's own
    # dependency tree, with no guarantee that would continue). Chosen over
    # PyMuPDF (AGPL-3.0/commercial dual license) and over pdf2image (needs
    # the poppler-utils system binary): pypdfium2 is BSD-3-Clause/Apache-2.0
    # and self-contained.
    "pypdfium2>=4.30,<6",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<1.16",
    # numpy is a genuine test-time dependency: tests/test_paddleocr_engine.py
    # imports it to build a numpy-convertible page stand-in for the (mocked)
    # PaddleOCR engine. Without it those 4 tests fail at import (279 passed);
    # declaring it here makes `uv sync --frozen --extra dev` install it.
    #
    # Capped below 2.5 because numpy 2.5.0+ ships .pyi stubs that use the PEP
    # 695 `type` alias statement, which mypy 1.15 rejects while the project's
    # mypy target is python_version = "3.11" ("Type statement is only
    # supported in Python 3.12 and greater", numpy/__init__.pyi). numpy 2.4.x
    # stubs are 3.11-parseable and satisfy the same >=2 runtime intent.
    "numpy>=2,<2.5",
]

[project.scripts]
capiro-defense-budget-parser = "capiro_defense_budget_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capiro_defense_budget_parser"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]