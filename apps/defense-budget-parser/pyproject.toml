[project]
name = "capiro-defense-budget-parser"
version = "0.1.0"
description = "Isolated Python parser runtime for defense-budget PDFs"
requires-python = ">=3.11,<3.13"
license = { text = "UNLICENSED" }

dependencies = [
    "pydantic>=2.7,<3",
    "pdfplumber>=0.11,<0.13",
    "pypdf>=4.0,<6",
]

[project.optional-dependencies]
camelot = [
    "camelot-py[cv]>=0.11,<0.13",
    "opencv-python-headless>=4.8,<5",
]
docling = [
    "docling>=2.5,<3",
]
ocr = [
    "paddleocr>=2.7,<3",
    "paddlepaddle>=2.6,<3",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
capiro-defense-budget-parser = "capiro_defense_budget_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capiro_defense_budget_parser"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]