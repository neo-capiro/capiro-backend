<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capiro</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#01226A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <!--
      Loaded BEFORE the Vite bundle so window.__CAPIRO_CONFIG__ is set when
      env.ts evaluates. In local dev the file does not exist (404 is harmless;
      env.ts falls back to import.meta.env). In ECS the web container's
      entrypoint writes this file on boot.
    -->
    <script src="/runtime-config.js"></script>
  </head>
  <!-- margin:0 lives here, not in a stylesheet, so it applies before first
       paint. theme.css declares the same value for the legacy surface, but
       main.tsx never loads theme.css on vNext (os.capiro.ai), so without
       this the UA's 8px body margin made every `min-height: 100dvh` vNext
       layout 16px taller than the viewport: a permanent scrollbar, and
       anything "centred" sitting 8px off. vnext-shell.html and
       vnext-dash.html hardcode it the same way. -->
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Start of HubSpot Embed Code -->
    <script type="text/javascript" id="hs-script-loader" async defer src="//js-na2.hs-scripts.com/245730593.js"></script>
    <!-- End of HubSpot Embed Code -->
  </body>
</html>
