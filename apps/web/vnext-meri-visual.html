<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Meri — Capiro (visual fixture)</title>
    <!-- Same font loading as index.html — the visual contract requires the
         real Inter faces, not fallback metrics. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <!--
      Dev/test-only visual fixture for the Meri vNext workspace. Mirrors the
      vnext-shell.html contract: inert runtime config, no Clerk, no network —
      meri-visual-main.tsx mounts the REAL VNextMeriShell against a
      contract-valid controller stub and a seeded chat store. Fixture data
      lives only in src/vnext/testing/visual/meri-visual-*; it never ships in
      the production bundle (index.html does not reference this entry).
    -->
    <script>
      window.__CAPIRO_CONFIG__ = Object.freeze({
        clerkPublishableKey: 'pk_test_vnext_visual_harness_not_a_real_key',
        apiBaseUrl: 'http://127.0.0.1:0',
        appEnv: 'vnext-visual-harness',
        webSurface: 'vnext',
      });
    </script>
    <script type="module" src="/src/vnext/testing/visual/meri-visual-main.tsx"></script>
  </body>
</html>
