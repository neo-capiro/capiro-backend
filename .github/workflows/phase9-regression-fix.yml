name: phase9-regression-fix

on:
  pull_request:
    branches: [main]
    paths:
      - docs/tmp/apply-meriv2-phase9-regression-fixes.py
      - .github/workflows/phase9-regression-fix.yml

permissions:
  contents: write

jobs:
  apply-phase9-regression-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
      - name: Apply Phase 9 regression contract fixes
        run: |
          git config user.name "capiro-phase9-bot"
          git config user.email "noreply@capiro.ai"
          python docs/tmp/apply-meriv2-phase9-regression-fixes.py
          rm docs/tmp/apply-meriv2-phase9-regression-fixes.py
          git add \
            apps/api/src/memory/memory-canonical-activation.helpers.spec.ts \
            apps/api/src/meri/meri-context-packet-view.spec.ts \
            docs/tmp/apply-meriv2-phase9-regression-fixes.py
          git commit -m "test(meriv2): align Phase 9 governed lifecycle regressions"
          git push origin HEAD:agent/meriv2-world-class-closeout
