name: legiwatch-feed-diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  feed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct all-source contract assertion
        run: python scripts/fix-legiwatch-late-link-test.py
      - run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @capiro/shared build
      - name: Focused feed test
        run: >
          pnpm --filter @capiro/web exec vitest run
          --testTimeout=20000 --hookTimeout=20000
          --reporter=verbose
          src/pages/clients/tracker/TrackerFeedPanel.test.tsx
      - name: Commit corrected regression test
        run: |
          rm scripts/fix-legiwatch-late-link-test.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/clients/tracker/TrackerFeedPanel.test.tsx scripts/fix-legiwatch-late-link-test.py
          git diff --cached --check
          git commit -m 'test(legiwatch): match all-source feed URL contract'
          git push origin HEAD:agent/legiwatch-audit-fixes
