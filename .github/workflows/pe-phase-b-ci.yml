name: pe-phase-b-ci

on:
  pull_request:
    branches: [agent/pe-trust-phase-b-ci-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate API Prisma client
        run: pnpm --filter @capiro/api exec prisma generate
      - name: Build shared dependencies and typecheck money contract
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/meriv2-core build
          pnpm --filter @capiro/shared typecheck
      - name: Typecheck API and operational scripts
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @capiro/api typecheck 2>&1 | tee /tmp/pe-phase-b-typecheck.log
      - name: Upload temporary typecheck diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pe-phase-b-typecheck-log
          path: /tmp/pe-phase-b-typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Run Phase B targeted tests
        run: pnpm --filter @capiro/api verify:pe-phase-b
      - name: Validate entrypoint shell
        run: sh -n apps/api/scripts/entrypoint.sh
