name: pe-phase-b-ci

on:
  push:
    branches: [agent/pe-trust-phase-b]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate API Prisma client
        run: pnpm --filter @capiro/api exec prisma generate
      - name: Build and typecheck shared contract
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/shared typecheck
      - name: Typecheck API and operational scripts
        run: pnpm --filter @capiro/api typecheck
      - name: Run Phase B targeted tests
        run: pnpm --filter @capiro/api verify:pe-phase-b
      - name: Validate entrypoint shell
        run: sh -n apps/api/scripts/entrypoint.sh
