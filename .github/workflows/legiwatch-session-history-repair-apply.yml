name: legiwatch-session-history-repair-apply

on:
  push:
    branches: [agent/legiwatch-audit-fixes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legiwatch-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair and apply deterministic patches
        run: |
          python scripts/fix-legiwatch-session-patch-runner.py
          python scripts/apply-legiwatch-session-history-patches.py
      - name: Remove one-shot patch machinery and trigger
        run: |
          rm scripts/fix-legiwatch-session-patch-runner.py
          rm scripts/apply-legiwatch-session-history-patches.py
          rm -f scripts/legiwatch-session-history-trigger.txt
          rm .github/workflows/legiwatch-session-history-apply.yml
          rm .github/workflows/legiwatch-session-history-repair-apply.yml
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(legiwatch): paginate hearing session history'
          git push origin HEAD:agent/legiwatch-audit-fixes
