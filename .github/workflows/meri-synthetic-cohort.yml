name: meri-synthetic-cohort

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan is read-only; apply and rollback require all fixed confirmations'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - rollback
      tenant_slugs:
        description: 'Exact approved slugs, in order'
        required: true
        default: 'meri-foundation-20260928-t1,meri-foundation-20260928-t2'
      expected_existing_cohort:
        description: 'Exact existing nine-slug cohort'
        required: true
        default: 'c2-strategies,capiro-internal,dualsight,maven,prospering-solutions,revere,victory-six-advisors,rubin-turnbull,abramoff'
      expected_api_task_definition:
        description: 'Reviewed current API task definition'
        required: true
        default: 'capiro-dev-api:483'
      expected_api_digest:
        description: 'Reviewed running API digest'
        required: true
        default: 'sha256:640f76d01bd6d0b7658f1229aee90cd7979c75d8b0f7ab7df76a5d5b7abc3c68'
      expected_orchestrator_task_definition:
        description: 'Reviewed current orchestrator task definition'
        required: true
        default: 'capiro-dev-meriv2-orchestrator:84'
      expected_orchestrator_digest:
        description: 'Reviewed running orchestrator digest'
        required: true
        default: 'sha256:227550d5862037ef026b04e3a7cb8f77e3c3467f409e3ab5144ad0ce725018de'
      lead_preflight_confirmation:
        description: 'For apply/rollback: exact fixed lead DB flag plus active-research drain confirmation'
        required: false
        default: ''
      lead_preflight_receipt:
        description: 'For apply/rollback: non-secret reference to the separate lead-owned DB/read-only preflight receipt'
        required: false
        default: ''
      apply_confirmation:
        description: 'For apply only: ENABLE_FIXED_SYNTHETIC_MERI_COHORT'
        required: false
        default: ''
      rollback_confirmation:
        description: 'For rollback only: ROLLBACK_FIXED_SYNTHETIC_MERI_COHORT'
        required: false
        default: ''
      receipt_run_id:
        description: 'For rollback only: prior apply workflow run ID; no task definition input is accepted'
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: meri-synthetic-cohort-capiro-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  COHORT_OUTPUT_DIR: /tmp/meri-synthetic-cohort
  INPUT_MODE: ${{ inputs.mode }}
  INPUT_TENANT_SLUGS: ${{ inputs.tenant_slugs }}
  INPUT_EXISTING_COHORT: ${{ inputs.expected_existing_cohort }}
  INPUT_API_TD: ${{ inputs.expected_api_task_definition }}
  INPUT_API_DIGEST: ${{ inputs.expected_api_digest }}
  INPUT_ORCH_TD: ${{ inputs.expected_orchestrator_task_definition }}
  INPUT_ORCH_DIGEST: ${{ inputs.expected_orchestrator_digest }}
  INPUT_LEAD_CONFIRMATION: ${{ inputs.lead_preflight_confirmation }}
  INPUT_LEAD_RECEIPT: ${{ inputs.lead_preflight_receipt }}
  INPUT_APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
  INPUT_ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}
  INPUT_RECEIPT_RUN_ID: ${{ inputs.receipt_run_id }}

jobs:
  cohort-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Refuse every repository/ref except merged main
        if: github.repository != 'neo-capiro/capirov2' || github.ref != 'refs/heads/main'
        run: |
          echo 'This workflow may run only from neo-capiro/capirov2 main.' >&2
          exit 2

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run offline release-runner tests
        run: python3 scripts/meri-synthetic-cohort.test.py

      - name: Configure fixed dev AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: us-east-1

      - name: Download exact prior workflow receipt for guarded rollback
        if: inputs.mode == 'rollback'
        uses: actions/download-artifact@v4
        with:
          name: synthetic-cohort-receipt
          path: /tmp/meri-synthetic-cohort-source
          github-token: ${{ github.token }}
          repository: neo-capiro/capirov2
          run-id: ${{ inputs.receipt_run_id }}

      - name: Validate plan or execute explicitly confirmed configuration change
        run: |
          set -euo pipefail
          args=(
            --mode "$INPUT_MODE"
            --tenant-slugs "$INPUT_TENANT_SLUGS"
            --expected-existing-cohort "$INPUT_EXISTING_COHORT"
            --expected-api-task-definition "$INPUT_API_TD"
            --expected-api-digest "$INPUT_API_DIGEST"
            --expected-orchestrator-task-definition "$INPUT_ORCH_TD"
            --expected-orchestrator-digest "$INPUT_ORCH_DIGEST"
            --lead-preflight-confirmation "$INPUT_LEAD_CONFIRMATION"
            --lead-preflight-receipt "$INPUT_LEAD_RECEIPT"
            --apply-confirmation "$INPUT_APPLY_CONFIRMATION"
            --rollback-confirmation "$INPUT_ROLLBACK_CONFIRMATION"
            --receipt-run-id "$INPUT_RECEIPT_RUN_ID"
            --output-dir "$COHORT_OUTPUT_DIR"
            --wait-timeout-seconds 900
          )
          if [[ "$INPUT_MODE" == rollback ]]; then
            args+=(--receipt /tmp/meri-synthetic-cohort-source/receipt.json)
          fi
          python3 scripts/meri-synthetic-cohort.py "${args[@]}"

      - name: Upload sanitized plan/receipt only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-cohort-receipt
          path: /tmp/meri-synthetic-cohort
          if-no-files-found: warn
          retention-days: 30
