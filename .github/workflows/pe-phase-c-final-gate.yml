name: pe-phase-c-final-gate

on:
  pull_request:
    branches: [agent/pe-trust-phase-b]

concurrency:
  group: pe-phase-c-final-gate
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase_c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase_c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pe-trust-phase-c
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate API Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/phase_c?schema=public
        run: pnpm --filter @capiro/api exec prisma generate --schema prisma/schema.prisma

      - name: Build shared dependencies
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/meriv2-core build

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/phase_c?schema=public
        run: pnpm --filter @capiro/api exec prisma validate --schema prisma/schema.prisma

      - name: Format Phase C text artifacts
        run: |
          pnpm exec prettier --write \
            apps/api/package.json \
            apps/api/scripts/lib/pe-watch-tenant-isolation.spec.ts \
            apps/api/scripts/send-pe-alert-emails.ts \
            apps/api/scripts/send-pe-alert-emails.watch-isolation.spec.ts \
            apps/api/src/program-element/pe-alerts/tenant-watch-aggregation.ts \
            apps/api/src/program-element/program-element-read.service.spec.ts \
            apps/api/src/program-element/program-element-read.service.ts \
            apps/api/src/program-element/program-element-watch.tenant-isolation.spec.ts \
            apps/api/tsconfig.pe-phase-a.json \
            docs/runbooks/program-element-watch-tenant-isolation-rollout.md

      - name: Verify formatting for Phase C text artifacts
        run: |
          pnpm exec prettier --check \
            apps/api/package.json \
            apps/api/scripts/lib/pe-watch-tenant-isolation.spec.ts \
            apps/api/scripts/send-pe-alert-emails.ts \
            apps/api/scripts/send-pe-alert-emails.watch-isolation.spec.ts \
            apps/api/src/program-element/pe-alerts/tenant-watch-aggregation.ts \
            apps/api/src/program-element/program-element-read.service.spec.ts \
            apps/api/src/program-element/program-element-read.service.ts \
            apps/api/src/program-element/program-element-watch.tenant-isolation.spec.ts \
            apps/api/tsconfig.pe-phase-a.json \
            docs/runbooks/program-element-watch-tenant-isolation-rollout.md

      - name: Typecheck API and operational scripts
        run: pnpm --filter @capiro/api typecheck

      - name: Re-run Phase A safety gate
        run: pnpm --filter @capiro/api verify:pe-phase-a

      - name: Re-run Phase B gate
        run: pnpm --filter @capiro/api verify:pe-phase-b

      - name: Re-run Phase C gate
        run: pnpm --filter @capiro/api verify:pe-phase-c

      - name: Rehearse Phase C migrations and RLS in disposable PostgreSQL
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          PSQL=(psql -h 127.0.0.1 -U postgres -d phase_c -v ON_ERROR_STOP=1)
          APP_PSQL=(psql -h 127.0.0.1 -U phase_c_app -d phase_c -v ON_ERROR_STOP=1 -qAt)
          TENANT_A='00000000-0000-0000-0000-000000000001'
          TENANT_B='00000000-0000-0000-0000-000000000003'
          USER_ID='00000000-0000-0000-0000-000000000002'
          PE='0603270A'

          "${PSQL[@]}" <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;

          CREATE OR REPLACE FUNCTION current_tenant_id() RETURNS UUID AS $$
          DECLARE
            v_raw TEXT := current_setting('app.current_tenant', true);
          BEGIN
            IF v_raw IS NULL OR v_raw = '' THEN
              RETURN NULL;
            END IF;
            RETURN v_raw::uuid;
          EXCEPTION WHEN invalid_text_representation THEN
            RETURN NULL;
          END;
          $$ LANGUAGE plpgsql STABLE;

          CREATE OR REPLACE FUNCTION rls_bypass() RETURNS BOOLEAN AS $$
          BEGIN
            RETURN current_setting('app.bypass_rls', true) = 'on';
          END;
          $$ LANGUAGE plpgsql STABLE;

          CREATE TABLE "users" ("id" UUID PRIMARY KEY);
          CREATE TABLE "tenants" ("id" UUID PRIMARY KEY);
          CREATE TABLE "program_element" ("pe_code" VARCHAR(16) PRIMARY KEY);

          INSERT INTO "tenants" ("id") VALUES
            ('00000000-0000-0000-0000-000000000001'),
            ('00000000-0000-0000-0000-000000000003');
          INSERT INTO "users" ("id") VALUES
            ('00000000-0000-0000-0000-000000000002');
          INSERT INTO "program_element" ("pe_code") VALUES ('0603270A');

          CREATE ROLE phase_c_app LOGIN PASSWORD 'phase_c';
          SQL

          "${PSQL[@]}" -f apps/api/prisma/migrations/20260528112943_add_program_element_watch/migration.sql

          # Prove the expand migration aborts rather than accepting duplicate
          # tenant/user/PE rows when legacy database drift has removed its key.
          "${PSQL[@]}" -c 'DROP INDEX "program_element_watch_user_pe_code_key";'
          "${PSQL[@]}" -c "INSERT INTO program_element_watch (tenant_id, user_id, pe_code) VALUES ('$TENANT_A', '$USER_ID', '$PE'), ('$TENANT_A', '$USER_ID', '$PE');"
          if "${PSQL[@]}" -f apps/api/prisma/migrations/20260728230000_add_tenant_scoped_pe_watch_key/migration.sql >/tmp/phase-c-duplicate.log 2>&1; then
            echo 'Expected duplicate preflight to abort, but it succeeded.' >&2
            exit 1
          fi
          grep -q 'duplicate tenant/user/PE rows' /tmp/phase-c-duplicate.log

          # Recreate the legacy starting state, then apply the real expansion.
          "${PSQL[@]}" -c 'DROP TABLE "program_element_watch" CASCADE;'
          "${PSQL[@]}" -f apps/api/prisma/migrations/20260528112943_add_program_element_watch/migration.sql
          "${PSQL[@]}" -f apps/api/prisma/migrations/20260728230000_add_tenant_scoped_pe_watch_key/migration.sql

          # Prove the RLS correction refuses to OR-combine with an unexpected
          # out-of-band permissive policy.
          "${PSQL[@]}" -c 'CREATE POLICY "unexpected_policy" ON "program_element_watch" USING (true) WITH CHECK (true);'
          if "${PSQL[@]}" -f apps/api/prisma/migrations/20260728230100_enable_program_element_watch_rls/migration.sql >/tmp/phase-c-policy.log 2>&1; then
            echo 'Expected pre-existing-policy guard to abort, but it succeeded.' >&2
            exit 1
          fi
          grep -q 'already has an RLS policy' /tmp/phase-c-policy.log
          "${PSQL[@]}" -c 'DROP POLICY "unexpected_policy" ON "program_element_watch";'
          "${PSQL[@]}" -f apps/api/prisma/migrations/20260728230100_enable_program_element_watch_rls/migration.sql

          "${PSQL[@]}" <<'SQL'
          GRANT USAGE ON SCHEMA public TO phase_c_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON "program_element_watch" TO phase_c_app;

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = current_schema()
                AND indexname = 'program_element_watch_user_pe_code_key'
            ) THEN
              RAISE EXCEPTION 'legacy PE-watch key is missing during expand release';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = current_schema()
                AND indexname = 'program_element_watch_tenant_user_pe_code_key'
            ) THEN
              RAISE EXCEPTION 'tenant-aware PE-watch key is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_class
              WHERE oid = 'program_element_watch'::regclass
                AND relrowsecurity
                AND relforcerowsecurity
            ) THEN
              RAISE EXCEPTION 'PE-watch RLS is not enabled and forced';
            END IF;
            IF (SELECT COUNT(*) FROM pg_policies WHERE schemaname = current_schema() AND tablename = 'program_element_watch') <> 1 THEN
              RAISE EXCEPTION 'PE-watch table must have exactly one reviewed policy';
            END IF;
          END
          $$;
          SQL

          # No tenant context fails closed.
          app_count=$(PGPASSWORD=phase_c "${APP_PSQL[@]}" -c 'SELECT COUNT(*) FROM program_element_watch;')
          test "$app_count" = '0'

          # Tenant A can insert and see only its own watch.
          a_count=$(PGPASSWORD=phase_c "${APP_PSQL[@]}" -c "SET app.current_tenant = '$TENANT_A'; INSERT INTO program_element_watch (tenant_id, user_id, pe_code) VALUES ('$TENANT_A', '$USER_ID', '$PE'); SELECT COUNT(*) FROM program_element_watch;")
          test "$a_count" = '1'

          # A tenant-A session cannot insert a tenant-B row.
          if PGPASSWORD=phase_c "${APP_PSQL[@]}" -c "SET app.current_tenant = '$TENANT_A'; INSERT INTO program_element_watch (tenant_id, user_id, pe_code) VALUES ('$TENANT_B', '$USER_ID', '$PE');" >/tmp/phase-c-rls-deny.log 2>&1; then
            echo 'Expected cross-tenant insert to be denied by RLS.' >&2
            exit 1
          fi
          grep -q 'violates row-level security policy' /tmp/phase-c-rls-deny.log

          # During coexistence the legacy key blocks the same user+PE in B, but
          # the existing A row must remain unchanged.
          if PGPASSWORD=phase_c "${APP_PSQL[@]}" -c "SET app.current_tenant = '$TENANT_B'; INSERT INTO program_element_watch (tenant_id, user_id, pe_code) VALUES ('$TENANT_B', '$USER_ID', '$PE');" >/tmp/phase-c-legacy-key.log 2>&1; then
            echo 'Expected legacy key to block the second-tenant row during coexistence.' >&2
            exit 1
          fi
          grep -q 'program_element_watch_user_pe_code_key' /tmp/phase-c-legacy-key.log
          test "$("${PSQL[@]}" -qAtc "SELECT COUNT(*) FROM program_element_watch WHERE tenant_id = '$TENANT_A';")" = '1'
          test "$("${PSQL[@]}" -qAtc "SELECT COUNT(*) FROM program_element_watch WHERE tenant_id = '$TENANT_B';")" = '0'

          # Simulate the separately approved contract release. After only the
          # legacy key is removed, both tenant rows can coexist and RLS keeps
          # reads/deletes tenant-local.
          "${PSQL[@]}" -c 'DROP INDEX "program_element_watch_user_pe_code_key";'
          PGPASSWORD=phase_c "${APP_PSQL[@]}" -c "SET app.current_tenant = '$TENANT_B'; INSERT INTO program_element_watch (tenant_id, user_id, pe_code) VALUES ('$TENANT_B', '$USER_ID', '$PE');" >/dev/null
          test "$(PGPASSWORD=phase_c "${APP_PSQL[@]}" -c "SET app.current_tenant = '$TENANT_A'; SELECT COUNT(*) FROM program_element_watch;")" = '1'
          test "$(PGPASSWORD=phase_c "${APP_PSQL[@]}" -c "SET app.current_tenant = '$TENANT_B'; SELECT COUNT(*) FROM program_element_watch;")" = '1'
          test "$(PGPASSWORD=phase_c "${APP_PSQL[@]}" -c "SET app.current_tenant = '$TENANT_B'; DELETE FROM program_element_watch WHERE tenant_id = '$TENANT_A' AND user_id = '$USER_ID' AND pe_code = '$PE'; SELECT COUNT(*) FROM program_element_watch;")" = '1'
          test "$("${PSQL[@]}" -qAtc "SELECT COUNT(*) FROM program_element_watch WHERE tenant_id = '$TENANT_A';")" = '1'
          test "$("${PSQL[@]}" -qAtc "SELECT COUNT(*) FROM program_element_watch WHERE tenant_id = '$TENANT_B';")" = '1'

      - name: Validate shell entrypoints and diff
        run: |
          sh -n apps/api/scripts/entrypoint.sh
          sh -n apps/api/scripts/entrypoint-legacy.sh
          sh -n apps/api/scripts/entrypoint-dispatcher.inc
          git diff --check

      - name: Remove temporary gate and record verified rehearsal
        shell: bash
        run: |
          git rm .github/workflows/pe-phase-c-final-gate.yml
          git add \
            apps/api/package.json \
            apps/api/scripts/lib/pe-watch-tenant-isolation.spec.ts \
            apps/api/scripts/send-pe-alert-emails.ts \
            apps/api/scripts/send-pe-alert-emails.watch-isolation.spec.ts \
            apps/api/src/program-element/pe-alerts/tenant-watch-aggregation.ts \
            apps/api/src/program-element/program-element-read.service.spec.ts \
            apps/api/src/program-element/program-element-read.service.ts \
            apps/api/src/program-element/program-element-watch.tenant-isolation.spec.ts \
            apps/api/tsconfig.pe-phase-a.json \
            docs/runbooks/program-element-watch-tenant-isolation-rollout.md
          git config user.name 'capiro-phase-c-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'test(program-elements): verify Phase C migration rollout'
          git push origin HEAD:agent/pe-trust-phase-c
