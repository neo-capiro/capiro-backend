name: meri-synthetic-governance

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, apply, rollback]
        default: plan
        required: true
        description: 'Fixed approved two-tenant API memory governance only'
      qualification_json:
        required: false
        description: 'Plan only: fresh reviewed qualification of currently served immutable API image'
      manifest_json:
        required: false
        description: 'Apply/rollback: exact reviewed sanitized plan JSON'
      manifest_sha256:
        required: false
        description: 'Explicit reviewed plan canonical SHA256'
      prior_receipt_json:
        required: false
        description: 'Rollback only: unchanged prior execution receipt JSON'
      prior_receipt_sha256:
        required: false
        description: 'Rollback only: explicit reviewed receipt canonical SHA256'
      confirmation:
        required: false
        description: 'APPLY_FIXED_SYNTHETIC_MEMORY_GOVERNANCE or ROLLBACK_FIXED_SYNTHETIC_MEMORY_GOVERNANCE'

permissions:
  contents: read
  id-token: write

concurrency:
  group: meri-api-configuration-capiro-dev
  cancel-in-progress: false

jobs:
  configuration:
    if: github.repository == 'neo-capiro/capirov2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_REGION: us-east-1
      GOV_MODE: ${{ inputs.mode }}
      GOV_QUALIFICATION: ${{ inputs.qualification_json }}
      GOV_MANIFEST: ${{ inputs.manifest_json }}
      GOV_MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
      GOV_PRIOR_RECEIPT: ${{ inputs.prior_receipt_json }}
      GOV_PRIOR_RECEIPT_SHA: ${{ inputs.prior_receipt_sha256 }}
      GOV_CONFIRMATION: ${{ inputs.confirmation }}
      GOV_CALLER_ROLE: ${{ vars.AWS_DEV_GHA_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact clean current merged main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = neo-capiro/capirov2
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20.16.0
      - name: Offline fixed-scope and fault tests before credentials
        run: node --test scripts/meri-synthetic-governance.test.mjs scripts/meri-synthetic-governance-transform.test.mjs
      - name: Materialize bounded JSON inputs without shell interpolation
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const dir=path.join(process.env.RUNNER_TEMP,'meri-synthetic-governance');
          await mkdir(dir,{recursive:false,mode:0o700});
          for(const [name,key] of [['qualification','GOV_QUALIFICATION'],['manifest','GOV_MANIFEST'],['prior-receipt','GOV_PRIOR_RECEIPT']]) {
            const value=process.env[key];
            if(!value) continue;
            if(Buffer.byteLength(value)>32768) throw Error('Input too large');
            await writeFile(path.join(dir,name+'.json'),JSON.stringify(JSON.parse(value)),{flag:'wx',mode:0o600});
          }
          NODE
      - name: Configure fixed dev role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: us-east-1
      - name: Run fixed operator with explicit reviewed hashes
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';
          const dir=path.join(process.env.RUNNER_TEMP,'meri-synthetic-governance'),file=n=>path.join(dir,n+'.json');
          const mode=process.env.GOV_MODE;
          let args;
          if(mode==='plan') {
            const match=/^arn:aws:iam::967807252336:role\/(?:[^/]+\/)*([^/]+)$/.exec(process.env.GOV_CALLER_ROLE??'');
            if(!match) throw Error('Fixed AWS dev role required');
            args=['plan','--qualification',file('qualification'),'--caller','arn:aws:iam::967807252336:role/'+match[1],'--out',file('plan')];
          } else if(mode==='apply'||mode==='rollback') {
            args=[mode,'--manifest',file('manifest'),'--approve',process.env.GOV_MANIFEST_SHA,'--confirm',process.env.GOV_CONFIRMATION,'--receipt',file('execution')];
            if(mode==='rollback') args.push('--prior-receipt',file('prior-receipt'),'--rollback-approve',process.env.GOV_PRIOR_RECEIPT_SHA);
          } else throw Error('Unsupported mode');
          const result=spawnSync(process.execPath,['scripts/meri-synthetic-governance.mjs',...args],{stdio:'inherit'});
          process.exit(result.status??1);
          NODE
      - name: Preserve sanitized plan and durable execution receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meri-synthetic-governance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/meri-synthetic-governance/plan.json
            ${{ runner.temp }}/meri-synthetic-governance/execution.json
            ${{ runner.temp }}/meri-synthetic-governance/execution.json.lock
          if-no-files-found: ignore
          retention-days: 14
