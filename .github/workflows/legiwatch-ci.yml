# LegiWatch release gate (Gate V phase c, §6.3).
#
# WHY THIS EXISTS SEPARATELY FROM ci-pr.yml
# -----------------------------------------
# ci-pr.yml enforces "no new failures versus baseline", which is correct for a
# repo carrying 40 pre-existing apps/api failures, 38 in apps/intel-api and 1 in
# apps/web. It is the wrong bar for shipping LegiWatch: 12 apps/api suites and 9
# apps/intel-api suites are ALREADY red, so a LegiWatch regression that lands
# inside one of them passes that bar untouched. ci-pr.yml also never runs the
# apps/web, apps/api or apps/intel-api suites at all.
#
# Inside LegiWatch scope the bar here is absolute: zero failures, zero skips.
#
# WHY IT IS NOT PATH-FILTERED
# ---------------------------
# A required check that is `paths:`-filtered never reports on a PR that misses
# the filter, and GitHub blocks that PR forever waiting for it. The whole
# in-scope run is ~90s, so it runs on every PR instead. Do not add `paths:`
# without also adding a skip-job that reports the same check name.
#
# SCOPE IS ENUMERATED, NOT GLOBBED (c-2)
# --------------------------------------
# Suite lists are explicit so the bar cannot silently shrink. Because an
# explicit list still degrades quietly if a rename stops a path from matching,
# every step also asserts a MINIMUM suite and test count via
# scripts/assert-test-summary.mjs. Raise the floors when you add suites.
#
# PROMOTER COVERAGE IS REQUIRED
# -----------------------------
# test/watchlist-match-promoter.spec.ts was previously excluded because its mock
# still modeled the pre-RLS `$transaction` implementation. The production service
# uses `withTenant`; the repaired suite now exercises that real boundary and is
# included in the absolute-zero LegiWatch bar.
#
# THE apps/web VITEST FLAKE IS NOT IN SCOPE EITHER (c-5)
# ------------------------------------------------------
# The `Cannot find package '@vitest/utils'` / `[vitest-worker]: Timeout calling
# "onUnhandledError"` crash originates in
# src/pages/strategy/agents/ReviewQueue.stale-notice.test.tsx — a STRATEGY test,
# not a LegiWatch one, so the explicit list below never executes it and it
# cannot make this required check flaky.
#
# Root cause, diagnosed 2026-07-28 and no longer a mystery: `@vitest/utils` is
# NOT resolvable from apps/web. It exists only in pnpm's virtual store
# (node_modules/.pnpm/@vitest+utils@2.1.9) and is not a declared dependency of
# apps/web, so under pnpm's strict layout it resolves from vitest's own context
# but not from the test root. When a worker hits an unhandled error and tries to
# report it through onUnhandledError, that import fails, the reporter call never
# returns, and the worker times out. Both symptoms, one cause — and it only
# fires when a test produces an unhandled error, which is why it looks random.
#
# The one-line remedy is to declare it in apps/web:
#     pnpm --filter @capiro/web add -D @vitest/utils@2.1.9
# (2.1.9 is already in the lockfile as a transitive dep, so nothing new enters
# the tree.) It is NOT applied here because MASTER §3.2 makes dependency changes
# a separate decision and this gate must not touch the lockfile every CI job
# installs from.
name: legiwatch-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legiwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The enumerated apps/api Jest run repeatedly exceeded Node's default
    # ~2 GiB heap before it could write its JSON summary. Keep one worker
    # and a bounded larger heap so the absolute-zero gate is deterministic.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      folder-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legiwatch_test
          POSTGRES_PASSWORD: legiwatch_test
          POSTGRES_DB: capiro
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U legiwatch_test -d capiro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      saved-session-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: legiwatch_test
          POSTGRES_PASSWORD: legiwatch_test
          POSTGRES_DB: legiwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legiwatch_test -d legiwatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The api and intel-api suites import their generated Prisma clients.
      # `generate` never connects to a database. The saved-session association
      # suite below uses a disposable PostgreSQL service and temporary fixtures.
      - name: Generate Prisma clients
        run: |
          pnpm --filter @capiro/api exec prisma generate
          pnpm --filter @capiro/intel-api exec prisma generate

      # Scoped to the three packages LegiWatch spans, deliberately NOT repo-wide.
      # ci-pr.yml already runs `turbo run typecheck` across all 14 packages on
      # every PR, so a second whole-repo pass here buys no signal and costs ~2min.
      #
      # It also has to be scoped to stay CORRECT: a whole-repo typecheck requires
      # all FIVE Prisma clients generated (ci-pr.yml generates api, workspace,
      # intel-api, onboard-api, api-strategy). With only the two above, every raw
      # query in the ungenerated packages collapses to `{}` and apps/onboard-api
      # fails outright on `Cannot find module '../../generated/prisma-client'` —
      # 100+ errors in code this gate does not own. Generated clients and
      # typechecked packages must agree; these two lists are that agreement.
      - name: Typecheck (apps/api, apps/intel-api, apps/web)
        run: pnpm turbo run typecheck --filter=@capiro/api --filter=@capiro/intel-api --filter=@capiro/web

      - name: Tests — saved hearing association SQL
        env:
          DATABASE_URL: postgresql://legiwatch_test:legiwatch_test@localhost:5432/legiwatch_test
        run: >
          pnpm --filter @capiro/api exec jest --ci --silent --runInBand
          --json --outputFile=$GITHUB_WORKSPACE/saved-session-sql-summary.json
          src/live-hearings/legiwatch-saved-sessions-pg.integration.spec.ts

      - name: LegiWatch additive migrations and PostgreSQL recovery
        env:
          DATABASE_URL: postgresql://legiwatch_test:legiwatch_test@localhost:5433/capiro
        run: |
          pnpm --filter @capiro/api exec prisma migrate deploy
          pnpm --filter @capiro/intel-api exec prisma migrate deploy
          pnpm --filter @capiro/intel-api exec jest --ci --runInBand --json --outputFile=$GITHUB_WORKSPACE/folder-pg-summary.json test/folder-tracker-postgres.spec.ts test/folder-import-postgres.spec.ts
          pnpm --filter @capiro/api exec jest --ci --runInBand --json --outputFile=$GITHUB_WORKSPACE/source-pg-summary.json src/ingestion/legiscan-documents-postgres.spec.ts
          node --test apps/intel-api/scripts/legiwatch-import-apply.spec.mjs
          node --test apps/intel-api/scripts/entrypoint-migrate.spec.mjs

      - name: Phase 2 report, source and delivery qualification
        env:
          DATABASE_URL: postgresql://legiwatch_test:legiwatch_test@localhost:5433/capiro
        run: |
          pnpm --filter @capiro/intel-api exec jest --ci --runInBand --json --outputFile=$GITHUB_WORKSPACE/phase2-report-summary.json test/legiwatch-reports-postgres.spec.ts src/tracker/reports/report-domain.spec.ts
          pnpm --filter @capiro/api exec jest --ci --runInBand --json --outputFile=$GITHUB_WORKSPACE/phase2-source-summary.json src/ingestion/legiscan-published-records-postgres.spec.ts src/ingestion/legiscan-published-records.spec.ts
          pnpm --filter @capiro/web exec vitest run --reporter=json --outputFile=$GITHUB_WORKSPACE/phase2-web-summary.json src/vnext/pages/legiwatch/reports/ReportWorkspace.test.tsx

      - name: Assert Phase 2 qualification is clean
        if: always()
        run: |
          node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/phase2-report-summary.json" phase2-reports 2 34
          node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/phase2-source-summary.json" phase2-source 2 6
          node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/phase2-web-summary.json" phase2-web 1 6

      - name: Assert Phase 1 PostgreSQL suites are clean
        if: always()
        run: |
          node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/folder-pg-summary.json" phase1-folders 2 17
          node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/source-pg-summary.json" phase1-source 1 2

      - name: Assert saved hearing association SQL is clean
        if: always()
        run: node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/saved-session-sql-summary.json" saved-session-sql 1 17

      # ---------------------------------------------------------------- api --
      # Gate H (memo lifecycle), Gate I (entailment/filing), Gate J (integrity),
      # Gate L (packet enrichment), the legacy digest rail, and Gate V's own
      # deploy-truth scripts. `src/intelligence/alert-memo/` also covers the
      # dedicated hearing-recap contract (hearing-recap.spec.ts) — recaps live on
      # that Documents boundary but must never reuse alert-memo/save.
      #
      # Live Hearings Phase 3 adds `src/hearing-discovery/` (canonical identity,
      # projection/diff, the capture-policy ceiling, and the official-source
      # parsers this phase moved out of the live sync-hearings.ts job) and
      # `src/live-hearings/` (master-calendar reads + the cross-tenant overlay
      # boundary). `src/prisma/tenant-scope-guard.spec.ts` is enumerated
      # explicitly because the new subscription reads are exactly the class of
      # access it guards. Floors raised 22/256 -> 31/409, measured from a real
      # local run of exactly this list (31 suites discovered, 409 tests passing).
      #
      # Phase 1 runs the database suites against the migrated service above.
      # Keep -- before positional paths: Jest's array-valued ignore option
      # otherwise consumes them and silently runs the wrong scope.
      - name: Tests — apps/api LegiWatch scope
        env:
          DATABASE_URL: postgresql://legiwatch_test:legiwatch_test@localhost:5433/capiro
        run: >
          pnpm --filter @capiro/api exec jest --ci --silent --runInBand
          --json --outputFile=$GITHUB_WORKSPACE/api-summary.json
          --testPathIgnorePatterns=legiwatch-saved-sessions-pg.integration.spec.ts
          --
          src/tracker/
          src/intelligence/alert-memo/
          src/intelligence/canonical-alert.adapter.spec.ts
          src/intelligence/intelligence.alerts-worklist.spec.ts
          src/engagement/generation/alert-packet-client.service.spec.ts
          src/reviews/reviews.service.spec.ts
          src/prisma/legiwatch-live-hearings-foundation-migration.spec.ts
          src/prisma/tenant-scope-guard.spec.ts
          src/hearing-discovery/
          src/live-hearings/
          scripts/verify-migrations.spec.ts
          scripts/verify-image-parity.spec.ts
          scripts/sync-legiscan-bills.spec.ts

      - name: Assert apps/api scope is clean
        if: always()
        run: node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/api-summary.json" apps/api 75 988

      # ---------------------------------------------------------- intel-api --
      # Gate F (feed worklist truth), Gate G (delivery), Gate K (scoring and
      # watchlist topics), the packet builder, the email-CTA route contract, the
      # watchlist-match → hearing-alert promoter, and the browser-audio hearing
      # capture lifecycle (session lease, gateway protocol, Deepgram WebM safety,
      # segment persistence, transcript reads).
      - name: Tests — apps/intel-api LegiWatch scope
        run: >
          pnpm --filter @capiro/intel-api exec jest --ci --silent --runInBand
          --json --outputFile=$GITHUB_WORKSPACE/intel-summary.json
          src/feed/alert-packet.spec.ts
          src/feed/feed-bill-events.controller.spec.ts
          src/hearing/ws-origin.spec.ts
          src/hearing/deepgram-stream.manager.spec.ts
          src/hearing/hearing-ai-credential-resolver.client.spec.ts
          src/hearing/hearing-capture-hardening.spec.ts
          src/hearing/hearing-gateway.capture.spec.ts
          src/hearing/hearing-tenant-scoping.spec.ts
          src/hearing/hearing-ws-ticket.service.spec.ts
          src/hearing/capture/automatic-stream-resolver.spec.ts
          src/hearing/capture/ffmpeg-audio-command.spec.ts
          src/hearing/capture/ffmpeg-deepgram-capture.runtime.spec.ts
          src/hearing/capture/hearing-subscription.repository.spec.ts
          src/hearing/capture/public-capture-credentials.adapter.spec.ts
          src/hearing/capture/public-capture-credentials.spec.ts
          src/hearing/capture/public-capture-disposition-backfill.spec.ts
          src/hearing/capture/public-capture-jobs.spec.ts
          src/hearing/capture/public-capture-persistent-queue.adapter.spec.ts
          src/hearing/capture/public-capture-queue.adapter.spec.ts
          src/hearing/capture/public-capture-task-runner.spec.ts
          src/hearing/capture/public-capture.orchestrator.spec.ts
          src/hearing/capture/public-hearing-capture-attempt.store.spec.ts
          src/hearing/capture/public-hearing-capture-state.spec.ts
          src/hearing/capture/public-hearing-capture.store.closeout.spec.ts
          src/hearing/capture/public-hearing-capture.store.spec.ts
          src/hearing/capture/public-hearing-transcript.store.spec.ts
          src/hearing/capture/server-deepgram-stream.manager.spec.ts
          src/hearing/capture/stream-preflight-policy.spec.ts
          src/hearing/capture/stream-resolution-policy.spec.ts
          src/hearing/intelligence/deterministic-public-hearing-extractor.spec.ts
          src/hearing/intelligence/hearing-intelligence-job.store.spec.ts
          src/hearing/intelligence/postgres-public-hearing-insight.store.spec.ts
          src/hearing/intelligence/public-hearing-boundary.spec.ts
          src/hearing/intelligence/public-hearing-intelligence.coordinator.spec.ts
          src/hearing/intelligence/public-hearing-intelligence.processor.spec.ts
          src/hearing/intelligence/tenant-hearing-relevance.processor.spec.ts
          src/tracker/tracker-alert-prefs-verification.spec.ts
          src/feed/recommended-actions.util.spec.ts
          src/intel-alert/canonical-alert.adapter.spec.ts
          src/intel-alert/intel-alert.service.dedupe-state-alerts.spec.ts
          src/tracker/change-detector.util.spec.ts
          src/tracker/email-cta-routes.spec.ts
          src/tracker/federal-bill-change-detector.spec.ts
          src/tracker/rule-change-detector.service.spec.ts
          src/tracker/state-bill-change-detector.spec.ts
          src/tracker/tracker-tenant-scoping.spec.ts
          test/alert-packet.spec.ts
          test/alert-scorer.spec.ts
          test/alert-scoring-v2.spec.ts
          test/alert-work-state.spec.ts
          test/feed.controller.spec.ts
          test/feed.spec.ts
          test/intel-alert-digest.spec.ts
          test/intel-alert-shadow.spec.ts
          test/tracker-board-feedback.spec.ts
          test/tracker-board-guards.spec.ts
          test/tracker-board-highfit.spec.ts
          test/tracker-board-pagination.spec.ts
          test/tracker-dto-validation.spec.ts
          test/tracker-email-links.spec.ts
          test/tracker-email-templates.spec.ts
          test/tracker-summary.spec.ts
          test/tracker-watchlist.spec.ts
          test/watchlist-compiler.spec.ts
          test/watchlist-mapping.spec.ts
          test/watchlist-matcher.spec.ts
          test/watchlist-match-promoter.spec.ts
          test/watchlist-weighting.spec.ts
          test/folder-tracker.spec.ts
          test/bill-dossier.spec.ts
          test/bill-dossier-state.spec.ts

      - name: Assert apps/intel-api scope is clean
        if: always()
        run: node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/intel-summary.json" apps/intel-api 71 763

      # ---------------------------------------------------------------- web --
      # Web interaction + accessibility (tracker-a11y.test.tsx) + the packet and
      # generation contract tests. ci-pr.yml runs NO web tests at all, so this is
      # the only gate that exercises the LegiWatch UI — including the Live Hearing
      # Room capture lifecycle, which is pure browser-API choreography (share
      # picker, MediaRecorder, WebSocket ordering) that no server test can cover.
      - name: Tests — apps/web LegiWatch scope
        run: >
          pnpm --filter @capiro/web exec vitest run
          --testTimeout=20000 --hookTimeout=20000
          --reporter=json --outputFile=$GITHUB_WORKSPACE/web-summary.json
          src/pages/clients/tracker/
          src/pages/radar/
          src/pages/bills/
          src/vnext/pages/bills/
          src/pages/intelligence/HearingWatchPage
          src/pages/intelligence/LiveHearingRoomPage.capture
          src/lib/hearing-watch-api
          src/lib/use-hearing-wake-lock
          src/vnext/pages/legiwatch/
          src/pages/clients/intelligence-v1/components/TopAlertsList
          src/pages/clients/intelligence-v1/components/HearingsMarkupList
          src/vnext/components/overlays/overlays.test.tsx
          src/vnext/figma-strategy-legiwatch-contract.test.ts
          src/vnext/foundation-contract.test.ts

      # Vitest counts describe blocks; Jest counts files. Floors are measured
      # from this exact scope, with zero failures and zero skips required.
      - name: Assert apps/web scope is clean
        if: always()
        run: node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/web-summary.json" apps/web 246 794
