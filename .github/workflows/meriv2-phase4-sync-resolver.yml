name: MeriV2 Phase 4 main-sync finalizer

on:
  push:
    branches: [agent/meriv2-world-class-closeout]
    paths: [.github/workflows/meriv2-phase4-sync-resolver.yml]

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'neo-capiro/capirov2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
      - name: Take authoritative funding guard and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Capiro Closeout Agent'
          git config user.email 'noreply@capiro.ai'
          git fetch origin main
          git checkout origin/main -- apps/api/src/funding-opportunities/funding-opportunities.boundaries.spec.ts
          git rm -f .github/workflows/meriv2-phase4-sync-resolver.yml
          git rm -f .github/workflows/meriv2-sync-main-phase5.yml || true
          git rm -f docs/tmp/meriv2-phase5-sync-trigger.txt || true
          git add -A
          git diff --cached --check
          git commit -m 'chore(meri): finalize current-main conflict resolution'
          git push origin HEAD:agent/meriv2-world-class-closeout
