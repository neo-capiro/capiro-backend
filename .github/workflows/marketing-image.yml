# Builds the marketing site (capiro.ai) container image and pushes it to ECR.
# (capiro-gha-api ECR push policy extended to capiro/dev+staging/marketing 2026-07-04.)
# See api-image.yml for the auth/OIDC setup notes. Same pattern as web-image.yml.
# Deploys are NOT automated here — after the image is pushed, force a new
# deployment of the ECS service `capiro-dev-marketing` (interactively via
# Claude+MCP or `aws ecs update-service --force-new-deployment`), which re-pulls
# the mutable :latest tag. The marketing image is multi-stage: a node build
# stage renders the pages from marketing/templates, then nginx serves them.

name: marketing-image

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/marketing-image.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target env (dev|staging|prod)'
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TARGET_ENV: ${{ github.event.inputs.env || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_ENV == 'prod' && vars.AWS_PROD_GHA_ROLE_ARN || vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: marketing/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/marketing:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/marketing:latest

      - name: Output image digest
        run: echo "Pushed capiro/${TARGET_ENV}/marketing:${GITHUB_SHA}"
