name: pe-phase-c-sync-base

on:
  pull_request:
    branches: [agent/pe-trust-phase-b]

concurrency:
  group: pe-phase-c-base-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pe-trust-phase-c
          fetch-depth: 0

      - name: Merge current Phase B without committing
        shell: bash
        run: |
          git fetch origin agent/pe-trust-phase-b
          git config user.name 'capiro-phase-c-bot'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-ff --no-commit origin/agent/pe-trust-phase-b
          git rm .github/workflows/pe-phase-c-sync-base.yml

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate API Prisma client
        env:
          DATABASE_URL: postgresql://phase_c:phase_c@localhost:5432/phase_c?schema=public
        run: pnpm --filter @capiro/api exec prisma generate --schema prisma/schema.prisma

      - name: Build shared dependencies
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/meriv2-core build
          pnpm exec prettier --check packages/shared/src/money.ts

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://phase_c:phase_c@localhost:5432/phase_c?schema=public
        run: pnpm --filter @capiro/api exec prisma validate --schema prisma/schema.prisma

      - name: Typecheck API and operational scripts
        run: pnpm --filter @capiro/api typecheck

      - name: Re-run Phase A safety gate
        run: pnpm --filter @capiro/api verify:pe-phase-a

      - name: Re-run Phase B gate
        run: pnpm --filter @capiro/api verify:pe-phase-b

      - name: Re-run Phase C gate
        run: pnpm --filter @capiro/api verify:pe-phase-c

      - name: Validate shell entrypoints and merge diff
        run: |
          sh -n apps/api/scripts/entrypoint.sh
          sh -n apps/api/scripts/entrypoint-legacy.sh
          sh -n apps/api/scripts/entrypoint-dispatcher.inc
          git diff --check --cached
          git status --short

      - name: Commit and push verified base integration
        shell: bash
        run: |
          git commit -m 'chore(program-elements): sync Phase C with Phase B'
          git push origin HEAD:agent/pe-trust-phase-c
