name: phase8-closeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase8-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/meriv2-world-class-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify moving-main synchronization
        run: |
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = "0" || {
            echo 'Closeout branch is behind current main; refusing Phase 8 closeout.' >&2
            exit 1
          }

      - run: pnpm install --frozen-lockfile

      - name: Apply Phase 8 closeout fixes to current source
        run: python .github/scripts/phase8_closeout.py

      - name: Format Phase 8 closeout files
        run: |
          pnpm exec prettier --write \
            .github/workflows/memory-governance-ci.yml \
            apps/api/src/context/context-required-persistence.spec.ts \
            apps/api/src/context/context-rollout-live-paths.spec.ts \
            apps/api/src/engagement/engagement.service.ts \
            apps/api/src/intelligence/alert-memo/alert-memo.service.ts \
            apps/api/src/intelligence/alert-memo/district-brief.service.ts \
            apps/api/src/meri/meri-research.service.ts \
            apps/api/src/workspace-assistant/workspace-assistant.context-v2.spec.ts \
            apps/meriv2-orchestrator/src/meri/context-compiler.service.spec.ts \
            infra/cdk/lib/compute-stack.ts

      - name: Generate clients and build internal dependencies
        run: |
          pnpm --filter @capiro/api exec prisma generate
          pnpm --filter @capiro/api-strategy exec prisma generate
          pnpm --filter @capiro/intel-api exec prisma generate
          pnpm --filter @capiro/onboard-api exec prisma generate
          pnpm --filter @capiro/workspace exec prisma generate
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/auth build
          pnpm --filter @capiro/strategy-verifier build
          pnpm --filter @capiro/meriv2-core build

      - name: Typecheck full repository and infrastructure
        run: |
          pnpm turbo run typecheck
          pnpm --filter @capiro/infra-cdk typecheck

      - name: Run focused Phase 8 acceptance tests
        run: |
          pnpm --filter @capiro/meriv2-core exec jest --ci --runInBand \
            src/context/context-release-switch.spec.ts \
            src/context/context-rollout.spec.ts \
            src/context/compiler-v2.spec.ts \
            src/context/truthful-compiler.spec.ts
          pnpm --filter @capiro/api exec jest --ci --runInBand \
            src/context/context-required-persistence.spec.ts \
            src/context/context-rollout-live-paths.spec.ts \
            src/context/context-compiler-v2.service.spec.ts \
            src/workspace-assistant/workspace-assistant.context-v2.spec.ts
          pnpm --filter @capiro/meriv2-orchestrator exec jest --ci --runInBand \
            src/meri/context-compiler-v2.service.spec.ts \
            src/meri/context-compiler.service.spec.ts
          pnpm --filter @capiro/workspace exec jest --ci --runInBand \
            src/generation/context-compiler.canonical-memory.spec.ts

      - name: Commit validated Phase 8 closeout and remove temporary machinery
        run: |
          rm -f .github/workflows/phase8-closeout.yml
          rm -f .github/scripts/phase8_closeout.py
          allowed="$(cat <<'EOF'
          .github/scripts/phase8_closeout.py
          .github/workflows/memory-governance-ci.yml
          .github/workflows/phase8-closeout.yml
          apps/api/src/context/context-required-persistence.spec.ts
          apps/api/src/context/context-rollout-live-paths.spec.ts
          apps/api/src/engagement/engagement.service.ts
          apps/api/src/intelligence/alert-memo/alert-memo.service.ts
          apps/api/src/intelligence/alert-memo/district-brief.service.ts
          apps/api/src/meri/meri-research.service.ts
          apps/api/src/workspace-assistant/workspace-assistant.context-v2.spec.ts
          apps/meriv2-orchestrator/src/meri/context-compiler.service.spec.ts
          infra/cdk/lib/compute-stack.ts
          EOF
          )"
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' "$allowed" | sed '/^$/d' | sort)"
          test "$actual" = "$expected" || {
            echo 'Unexpected Phase 8 closeout diff:' >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }
          git diff --check
          git config user.name 'Capiro Closeout Agent'
          git config user.email 'noreply@capiro.ai'
          git add --all -- $allowed
          git commit -m 'fix(meriv2): close Phase 8 rollout boundaries'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
