# Build/test publication only. Promotion requires the reviewed digest release procedure.
name: web-image

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-image.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target env (dev|staging|prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TARGET_ENV: ${{ github.event.inputs.env || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate build isolation
        run: python3 scripts/validate-meri-build-isolation.py

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_ENV == 'prod' && vars.AWS_PROD_GHA_ROLE_ARN || vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            CAPIRO_WEB_BUILD_SURFACE=canonical
          tags: |
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/web:${{ github.sha }}
          # Restore deps from cache, but NEVER cache the build stage — that layer
          # runs `vite build`, and a stale restore was freezing dist/ (the live
          # SPA bundle never changed across merges). no-cache-filters forces the
          # build stage to re-run every time so each image ships a fresh bundle.
          no-cache-filters: build
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Record candidate digest (not promoted)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "Candidate: $REGISTRY/capiro/$TARGET_ENV/web@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA — build publication only; qualification and approval still required." >> "$GITHUB_STEP_SUMMARY"
