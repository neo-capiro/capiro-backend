name: Knowledge Plane Phase 17 CI

on:
  push:
    branches:
      - agent/knowledge-plane-phase-17-coverage-aware-context-packet-v2
    paths:
      - 'packages/meriv2-core/src/context/**'
      - 'packages/meriv2-core/src/index.ts'
      - 'apps/api/src/context/**'
      - 'apps/api/src/retrieval/**'
      - 'apps/api/prisma/migrations/20260817233500_context_packet_retrieval_context/**'
      - 'docs/knowledge-plane/phase-17-coverage-aware-context-packet-v2.md'
      - '.github/workflows/knowledge-phase17-ci.yml'
  pull_request:
    paths:
      - 'packages/meriv2-core/src/context/**'
      - 'packages/meriv2-core/src/index.ts'
      - 'apps/api/src/context/**'
      - 'apps/api/src/retrieval/**'
      - 'apps/api/prisma/migrations/20260817233500_context_packet_retrieval_context/**'
      - 'docs/knowledge-plane/phase-17-coverage-aware-context-packet-v2.md'
      - '.github/workflows/knowledge-phase17-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch hygiene
        run: git diff --check origin/main...HEAD

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages consumed by API
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/meriv2-core build

      - name: Validate and generate Prisma client
        env:
          DATABASE_URL: postgresql://capiro:capiro@localhost:5432/capiro
        run: |
          pnpm --filter @capiro/api exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @capiro/api exec prisma generate --schema prisma/schema.prisma

      - name: Phase 17 core completeness contracts
        run: |
          pnpm --filter @capiro/meriv2-core exec jest --runInBand --forceExit \
            src/context/coverage-aware-packet.spec.ts

      - name: Phase 17 API packet contracts
        run: |
          pnpm --filter @capiro/api exec jest --runInBand --forceExit \
            src/context/context-packet-v2.service.spec.ts \
            src/context/context-packet-v2-architecture.contract.spec.ts \
            src/context/context-packet-v2.migration.contract.spec.ts \
            src/context/phase17-context-packet.types.contract.spec.ts \
            src/context/context-layer.service.spec.ts \
            src/context/context-resolver.service.spec.ts \
            src/context/context-resolver-architecture.contract.spec.ts \
            src/context/context-compiler.service.spec.ts \
            src/context/context-compiler-v2.service.spec.ts

      - name: Retrieval coverage regressions
        run: |
          pnpm --filter @capiro/api exec jest --runInBand --forceExit \
            src/retrieval/retrieval-v2.service.spec.ts \
            src/retrieval/coverage-manifest.spec.ts \
            src/retrieval/adapters/core-prisma-security-scope.spec.ts

      - name: Reject Phase 17 TypeScript errors
        shell: bash
        run: |
          set +e
          pnpm --filter @capiro/api exec tsc --noEmit --pretty false > /tmp/api-tsc.log 2>&1
          api_status=$?
          pnpm --filter @capiro/meriv2-core exec tsc --noEmit --pretty false > /tmp/core-tsc.log 2>&1
          core_status=$?
          set -e
          cat /tmp/core-tsc.log
          cat /tmp/api-tsc.log
          if grep -E 'coverage-aware-packet|context-packet-v2|phase17-context-packet|context-layer|context\.module' /tmp/core-tsc.log /tmp/api-tsc.log; then
            echo "Phase 17 introduced TypeScript errors." >&2
            exit 1
          fi
          echo "Core typecheck exit: $core_status; API typecheck exit: $api_status (unrelated baseline errors, if any, are not attributed to Phase 17)."
