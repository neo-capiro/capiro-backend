name: legiwatch-late-deeplink-apply

on:
  push:
    branches: [agent/legiwatch-audit-fixes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legiwatch-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-legiwatch-late-deeplink-fix.py
      - name: Commit source and test only
        run: |
          git checkout -- .github/workflows/legiwatch-ci.yml
          rm scripts/apply-legiwatch-late-deeplink-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/pages/clients/tracker/TrackerFeedPanel.tsx \
            apps/web/src/pages/clients/tracker/TrackerFeedPanel.test.tsx \
            scripts/apply-legiwatch-late-deeplink-fix.py
          git diff --cached --check
          git commit -m 'fix(legiwatch): handle late-arriving alert deep links'
          git push origin HEAD:agent/legiwatch-audit-fixes
