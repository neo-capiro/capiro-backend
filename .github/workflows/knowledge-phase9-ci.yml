name: Knowledge Plane Phase 9 CI

on:
  push:
    branches:
      - agent/knowledge-plane-phase-9-retrieval-v2-final
    paths:
      - 'apps/api/src/retrieval/**'
      - 'apps/api/src/app.module.ts'
      - '.github/workflows/knowledge-phase9-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/src/retrieval/**'
      - 'apps/api/src/app.module.ts'
      - '.github/workflows/knowledge-phase9-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capiro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/capiro
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch hygiene
        run: git diff --check HEAD^

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages consumed by @capiro/api
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/meriv2-core build

      - name: Validate and generate Prisma client
        run: |
          pnpm --filter @capiro/api exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @capiro/api exec prisma generate --schema prisma/schema.prisma

      - name: Focused Phase 9 Retrieval V2 tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144 --experimental-vm-modules
        run: pnpm --filter @capiro/api exec jest --runInBand --forceExit src/retrieval

      - name: Knowledge Plane regression tests
        run: pnpm --filter @capiro/api exec jest --runInBand --forceExit src/knowledge

      - name: Reject Phase 9 TypeScript errors
        shell: bash
        run: |
          set +e
          pnpm --filter @capiro/api exec tsc --noEmit --pretty false > /tmp/api-tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/api-tsc.log
          if grep -E 'src/retrieval/|src/app\.module\.ts' /tmp/api-tsc.log; then
            echo "Phase 9 introduced TypeScript errors." >&2
            exit 1
          fi
          echo "Full API typecheck exit: $status (unrelated baseline errors, if any, are not attributed to Phase 9)."

      - name: Bootstrap disposable Postgres migration prerequisites
        env:
          CI_DISPOSABLE_POSTGRES: '1'
        run: bash scripts/ci/bootstrap-disposable-postgres-roles.sh

      - name: Deploy full Prisma migration chain to disposable pgvector/Postgres
        run: pnpm --filter @capiro/api exec prisma migrate deploy
