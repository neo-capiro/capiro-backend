      # suite asserts no action's evidence ever cites an inferred item. A target
      # is also never a PERSON: reviewed_relationship and acquisition_personnel
      # are both not_wired, so naming an individual would invent the
      # introduction outright.
      #
      # A CLOSED NOTICE AND A FORECAST NEVER PROPOSE A PURSUIT. Enforced
      # STRUCTURALLY by STAGE_ALLOWED_INTENTS and a thrown error, not by trusting
      # each branch to remember - a silent downgrade would ship a buggy rule with
      # a plausible plan on top of it. Forecast is decided by SOURCE and wins
      # over everything, so a withdrawn forecast still gets shaping advice rather
      # than "watch for a repost".
      #
      # AN UNMET DEPENDENCY IS STATED, NOT ASSUMED. "Build the compliance matrix"
      # with no requirements extracted is a step somebody starts and stalls on.
      # There is likewise NO fallback due date: a fabricated deadline on a notice
      # that states none is the most confidently wrong thing this plan could
      # emit, and a PAST date is returned rather than clamped to today.
      #
      # DETERMINISM. Same packet and same asOf produce a byte-identical plan,
      # ids and fingerprint included. `asOf` is threaded all the way into the
      # lifecycle read - a composer that consulted the wall clock there could
      # return two different plans for the same inputs. The fingerprint covers
      # facts only, so re-observing does not move it and a resolved prerequisite
      # does.
      # 63/2005 after P35: one NEW suite, and a migration
      # (20260901010000_funding_opportunity_pipeline_v2) rehearsed against a fresh
      # pgvector:pg16 with a clean replay, a retry-as-no-op, and every constraint
      # proved BY ACTUAL INSERT.
      #
      # funding-opportunity-pipeline.spec.ts (52 tests) covers six properties.
      #
      # THE ROLLING DEPLOY IS SURVIVABLE, and that is the load-bearing one. Old
      # pods keep writing workflow_status and know nothing about pipeline_stage, so
      # a row can carry a recorded stage its legacy status has moved past. ONE
      # function reconciles them: the legacy status WINS for anything it can
      # express, and the stage only adds resolution the legacy column cannot
      # (qualified and submitted, which both project onto pursuing). Comparing in
      # the other direction would call every qualified row stale. Every transition
      # writes BOTH columns in one statement, so a move stays visible to the
      # lifecycle processor, which decides what to alert on from the legacy column.
      #
      # AN UNSTAGED ROW IS UNSTAGED. `suggested` and `expired` map to NO stage, in
      # the backfill and in the read. Mapping suggested to `reviewing` would put the
      # producer's entire backlog on a board column named for a human activity
      # nobody is performing; mapping expired to anything fabricates a capture
      # history Capiro never recorded. The board reports both counts separately
      # rather than folding them in.
      #
      # INVALID TRANSITIONS FAIL, and the graph is the only authority. won and lost
      # are reachable ONLY from submitted - a bid cannot be won if it was never
      # submitted - and the move is validated against the EFFECTIVE stage, so a row
      # an old pod moved to `won` cannot be moved out of it on the strength of a
      # stale recorded `pursuing`.
      #
      # A CONCURRENT TRANSITION IS DETECTED. The version predicate is in the WHERE
      # of the UPDATE, so the loser of two simultaneous moves updates 0 rows and
      # gets a 409 instead of silently discarding the winner's decision.
      #
      # BOARD COUNTS COME FROM A GROUPED AGGREGATE over every workflow row, never
      # from the returned cards - a board that counted its own page would report 2
      # when the client has 915. `cardsTruncated` says when the card list is a
      # window; the counts never are.
      #
      # PRODUCERS CANNOT MOVE A STAGE: actor_user_id is NOT NULL on the audit row,
      # and the spec greps all three producer scripts for the column names.
      #
      # 65/2050 after P37: TWO suites join the gate, and only ONE of them is a new
      # file. meri-opportunity-tools.spec.ts (40 tests) is new and lands inside the
      # existing src/funding-opportunities/ glob. src/meri/meri-tools.registration
      # .spec.ts (6 tests) ALREADY EXISTED and is newly named here, for the same
      # reason config.schema.spec.ts and the two intelligence.* files are named:
      # it is topically owned by this program even though it does not live under
      # funding-opportunities/. Meri's tool registry now carries six Funding
      # Opportunities entries, and that spec is the thing standing between a
      # refactor and silently dropping one — outside this gate, a dropped tool
      # would be invisible here. The scope-detection regex above gained the three
      # src/meri/ files this phase touches, NOT the whole directory: pulling in
      # ~60 Meri suites would make this gate's runtime and its floor a function of
      # a subsystem it does not own.
      #
      # THE DEPENDENCY RUNS ONE WAY, and that is a test rather than a convention.
      # The adapter lives in src/funding-opportunities/; MeriModule imports THIS
      # module. A spec reads every .ts file in the directory and asserts none
      # imports from src/meri. The reverse edge is not a style preference —
      # MeriModule imports thirteen feature modules, so it would be a Nest
      # bootstrap failure, the kind that shows up as a broken deploy rather than a
      # red build.
      #
      # NO PROVIDER REACH, asserted structurally: the adapter's constructor takes
      # exactly three local collaborators (checked by arity AND by name), and its
      # source names no `external/tango`, `@makegov`, secret, gateway, `fetch` or
      # http client. That is what makes "Capiro has not synced this" an answer
      # these tools can give, and "let me check the provider" one they cannot.
      #
      # THE GATE IS FLAG, THEN ROLE, THEN WALL — in that order, and the order is
      # the point. A tenant without the capability learns nothing about its own
      # client roster. A portal user is refused BEFORE any client read is issued,
      # proven by call counts rather than by reading the code, so the refusal
      # cannot be timed. Only then does the ethical wall run.
      #
      # A DENIED CLIENT IS BYTE-IDENTICAL TO A NON-EXISTENT ONE, asserted with
      # toEqual across all six tools: anything that distinguishes them turns the
      # tool into an oracle for which clients exist behind a wall. P33's own denied
      # packet carries no `denied` flag — it is deliberately shaped like an empty
      # one down to the fingerprint — so the adapter detects it through the
      # per-source state, in a named and tested predicate, including the
      # `[].every() === true` case that would otherwise read a malformed empty
      # packet as an access refusal.
      #
      # REFUSALS ARE RESULTS, NOT EXCEPTIONS. A Meri tool result is text the model
      # reads mid-turn: a throw there either kills the turn or arrives as an opaque
      # stack-shaped string the model then paraphrases to a user. Every refusal is
      # a typed state with wording about what Capiro did, never about what is true
      # of the world. A THROWING flag read fails closed quietly here, unlike the
      # route guard's deliberately non-catching read — the two differ because a
      # broken read hides an endpoint in one case and degrades one answer in the
      # other.
      #
      # OUTPUT IS BOUNDED BY RANK, NOT BY BYTES. A byte budget drops whatever
      # happens to be last, so the same query could return different evidence on
      # two runs as unrelated fields grow; per-collection caps keep "which items
      # survived" a property of the data. `truncated` is ABSENT when nothing was
      # dropped rather than an empty array, and a clamped free-text field carries
      # its own marker INSIDE the string, because that value gets quoted.
      - name: Assert apps/api scope is clean
        if: always() && steps.scope.outputs.in_scope == 'true'
        run: node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/api-summary.json" apps/api 65 2050

      # ---------------------------------------------------------------- web --
      # ci-pr.yml runs no web tests at all, so this is the ONLY gate that exercises
      # the standalone Funding Opportunities page or the Intelligence Mappings
      # settings page.
      - name: Tests — apps/web Funding Opportunities scope
        if: steps.scope.outputs.in_scope == 'true'
        run: >
          pnpm --filter @capiro/web exec vitest run
          --testTimeout=20000 --hookTimeout=20000
          --reporter=json --outputFile=$GITHUB_WORKSPACE/web-summary.json
          src/pages/intelligence/opportunities/
          src/pages/settings/IntelligenceMappingsPage
          src/pages/clients/intelligence-v1/sections/FundingOpportunitiesSection
          src/App.funding-opportunities-nav

      # NOTE: vitest counts `describe` BLOCKS in numTotalTestSuites, not files —
      # measured 50 blocks / 211 tests on this branch (26/79 before this program).
      # The test count is the tighter signal; the block count is the coarse one.
      # Raised by P05 (mappings-page body assertions), P08 (atomic action route),
      # P09 (OpportunityCard.test.tsx, which is a NEW file — the block floor has to
      # move with it or the card's explanation tests could be deleted while green)
      # P11 (FundingOpportunityInbox.test.tsx, also new, plus the shell's
      # flag/URL-state blocks in FundingOpportunitiesPage.test.tsx) and P12
      # (FundingOpportunityDetail.test.tsx — the ref round-trip, the eight sections,
      # the route, and the drawer/page equivalence).
      #
      # 54/226 after P23: one NEW file, AcquisitionPositionPanel.test.tsx —
      # the three distinct reasons acquisitionPosition can be null (no
      # client, a grant, or the vehicle-fit flag off) each get their own
      # explanation and none reads as a negative determination; every
      # populated state renders and never with an eligibility or win-
      # probability word; related/teaming access never renders with
      # direct_prime_access's own text. OpportunityCard.test.tsx gained the
      # concise-badge proof: no badge at all when acquisitionPosition is
      # null, and a related-entity badge never shares text with a direct
      # one. FundingOpportunityDetail.test.tsx's "eight sections" sweep
      # shrank from three still-pending sections to two — acquisition
      # position is real now.
      # 63/274 after P26: one NEW file, ForecastOpportunityCard.test.tsx (33
      # tests across 6 blocks) — the card, the detail body, and the two pure
      # formatters. Its central block is named after the phase's own acceptance
      # line and asserts on RENDERED TEXT rather than on props: none of "open",
      # "eligible" or "deadline" appears anywhere in a forecast card, and the
      # ONE permitted use of "solicitation" is the field label whose value is
      # "Not provided by the source". A component can be perfectly wired and
      # still say "Deadline: none stated", which is the exact false claim the
      # phase exists to prevent — so the test reads the DOM.
      #
      # It also pins: Pursue and Submit are ABSENT from a forecast, not disabled
      # (a disabled button that never enables is a promise the surface does not
      # keep); with no action handler the whole action row is absent rather than
      # inert; a signal that could not be EVALUATED renders differently from one
      # evaluated and unmatched; and `formatSourceDate` formats a YYYY-MM-DD from
      # its PARTS, because `new Date('2027-03-01')` parsed as UTC midnight and
      # formatted locally shows 28 February to every reader west of Greenwich.
      #
      # FundingOpportunityInbox.test.tsx grew by 11 (38 -> 49): the flag-ON path
      # (forecast card rendered, forecast rail offered in the source filter, a
      # forecast ref written to the URL, the drawer titled as a forecast) and the
      # flag-OFF path (rail NOT offered, because an empty result from a filter
      # the capability cannot serve reads as "this client has no forecasts";
      # forecast rows WITHHELD with the count stated, because the tab badges
      # still include them and a silent discrepancy reads as a broken filter; and
      # a stale ?source=agency_forecast deep link degrading to ALL sources rather
      # than to an empty list). FundingOpportunityDetail.test.tsx grew by 4
      # (47 -> 51) for the shared route: a forecast deep link renders the
      # forecast body and hits the FORECAST endpoint, and with the flag off it
      # says the CAPABILITY is off rather than that the record is missing — two
      # different facts, and only one of them is about the forecast.
      # 67/287 after P28: one NEW file, OpportunityTimeline.test.tsx (13 tests
      # across 3 blocks). Its subject is the sentence on screen. The panel must
      # never say "the notice was updated" — that label is the reason the phase
      # exists, because an amendment that moved a deadline two weeks earlier and
      # one that added a Q&A attachment are not the same event. Every entry
      # names the DIMENSION and the composed summary, and the test reads the DOM
      # to prove it.
      #
      # The other block covers FOUR different kinds of nothing, only ONE of
      # which is a fact about the notice: the flag being off, the sync never
      # having run, the notice not being crosswalked, and the solicitation
      # genuinely never having been amended. Each gets its own sentence, and
      # each of the first three explicitly says it means nothing about whether
      # the solicitation was amended. Collapsing any of them into "no
      # amendments" is the false claim this program exists to avoid. A grant
      # never calls the API at all — Grants.gov publishes no notice history, a
      # fact about the source rather than a Capiro gap.
      # 70/297 after P31: one NEW file, OpportunityRequirementsPanel.test.tsx
      # (10 tests). Its two blocks are the panel's two rules. NO REQUIREMENT
      # RENDERS WITHOUT ITS CITATION - every row shows the verbatim excerpt, the
      # document, the page and the character offsets, and the panel states in as
      # many words that nothing in it is a summary, because a compliance list
      # nobody can check against the source invites a team to build a proposal
      # against Capiro's paraphrase. A model's assertion and a human's
      # acceptance are DIFFERENT badges, never the same one read two ways, and a
      # document that changed after extraction is flagged rather than silently
      # trusted.
      #
      # FOUR KINDS OF EMPTY, and only read_none_found is a fact about the
      # solicitation - and even it is qualified as "of a kind Capiro extracts".
      # The no_text case carries P30's PER-DOCUMENT reason through verbatim,
      # because "the account's plan excludes extracted text" and "this file is a
      # scan with no text layer" are different facts and only P30 knows which.
      #
      # FundingOpportunityDetail.test.tsx's P12-era "requirements is still a
      # PendingSection" assertion was replaced, not deleted: the section is real
      # now, and with the documents flag off (the default, and every real
      # tenant) it says the CAPABILITY is off and explicitly that this says
      # nothing about what the solicitation requires.
      # 75/314 after P32: one NEW file, OpportunityAssessmentPanel.test.tsx
      # (17 tests), and no api change at all - the phase is entirely about how
      # the detail surface behaves when part of it does not.
      #
      # ISOLATION. The drawer is now eight sections fed by five endpoints, four
      # of them secondary. Before this phase a render error in ANY of them took
      # the whole drawer with it, because React unmounts the nearest boundary
      # and there was none - leaving a blank panel where an executive
      # recommendation should be, with no way to tell "the recommendation is
      # pass" from "the page broke". Every section now has its OWN boundary, and
      # the test proves a sibling still renders when one throws. A single
      # boundary around the whole drawer would satisfy React and defeat the
      # purpose, so a structural test counts them. A PRIMARY failure (the
      # assessment itself) says no conclusion follows; a SECONDARY one says the
      # rest of the assessment stands. No stack trace or component stack reaches
      # the page - it tells a reader nothing and may quote source content the
      # surrounding phases treat as untrusted.
      #
      # PARITY, made structural. The card and the detail used to compose the
      # recommendation label independently, which is how a card can say "Pursue"
      # while the drawer says "Needs review" about the same row. The vocabulary
      # now lives in exactly one table in the api mirror, and two tests enforce
      # that: one asserts only that file declares the map, the other asserts no
      # component declares its own.
      #
      # And an absent recommendation stays absent: the unscored read and a
      # scored-but-uncomputed record get DIFFERENT sentences, and the second
      # explicitly rules out reading it as a pass.
      - name: Assert apps/web scope is clean
        if: always() && steps.scope.outputs.in_scope == 'true'
        run: node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/web-summary.json" apps/web 85 353

      # ------------------------------------------------------------- builds --
      # A passing typecheck is not a passing build: the api build runs `nest build`
      # (different module resolution) and the web build runs vite's production
      # transform, and each has caught errors the other did not.
      - name: Build apps/api
        if: steps.scope.outputs.in_scope == 'true'
        run: pnpm --filter @capiro/api build

      - name: Build apps/web
        if: steps.scope.outputs.in_scope == 'true'
        run: pnpm --filter @capiro/web build
