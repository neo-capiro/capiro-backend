      # nothing) - collapsing them turns "we have not built this" into "there is
      # nothing there". Every not_wired explanation is asserted to contain
      # "Nothing here says".
      #
      # DETERMINISM DOWN TO THE HASH. The ordering is TOTAL - without the id
      # tiebreaker two facilities in one state would sort by whatever order
      # Postgres returned them in and the fingerprint would move with no fact
