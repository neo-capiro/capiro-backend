      #
      # The suite floor MUST move with the file
      # count — otherwise the frozen-contract, profile-parity or identity suite could
      # be deleted and the gate would stay green. These numbers are also mirrored in
      # __fixtures__/baseline-contract-v1.json, which asserts this line is at or
      # above them, so lowering a floor takes two edits and both show up in the diff.
      # That is the point.
      # 44/1365 after P21: two NEW suites, no migration. federal-business-
      # profile.service.spec.ts (9 tests) covers the versioned aggregation —
      # verified is read from the `active` FLAG in history, never assumed to
      # be the last array element; firstParty and verified stay visibly
