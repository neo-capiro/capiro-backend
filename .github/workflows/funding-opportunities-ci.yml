          src/pages/clients/intelligence-v1/sections/FundingOpportunitiesSection
          src/App.funding-opportunities-nav

      # NOTE: vitest counts `describe` BLOCKS in numTotalTestSuites, not files —
      # measured 50 blocks / 211 tests on this branch (26/79 before this program).
      # The test count is the tighter signal; the block count is the coarse one.
      # Raised by P05 (mappings-page body assertions), P08 (atomic action route),
      # P09 (OpportunityCard.test.tsx, which is a NEW file — the block floor has to
      # move with it or the card's explanation tests could be deleted while green)
      # P11 (FundingOpportunityInbox.test.tsx, also new, plus the shell's
      # flag/URL-state blocks in FundingOpportunitiesPage.test.tsx) and P12
      # (FundingOpportunityDetail.test.tsx — the ref round-trip, the eight sections,
      # the route, and the drawer/page equivalence).
      #
      # 54/226 after P23: one NEW file, AcquisitionPositionPanel.test.tsx —
      # the three distinct reasons acquisitionPosition can be null (no
      # client, a grant, or the vehicle-fit flag off) each get their own
      # explanation and none reads as a negative determination; every
      # populated state renders and never with an eligibility or win-
      # probability word; related/teaming access never renders with
      # direct_prime_access's own text. OpportunityCard.test.tsx gained the
      # concise-badge proof: no badge at all when acquisitionPosition is
      # null, and a related-entity badge never shares text with a direct
      # one. FundingOpportunityDetail.test.tsx's "eight sections" sweep
      # shrank from three still-pending sections to two — acquisition
      # position is real now.
      # 63/274 after P26: one NEW file, ForecastOpportunityCard.test.tsx (33
      # tests across 6 blocks) — the card, the detail body, and the two pure
      # formatters. Its central block is named after the phase's own acceptance
      # line and asserts on RENDERED TEXT rather than on props: none of "open",
      # "eligible" or "deadline" appears anywhere in a forecast card, and the
      # ONE permitted use of "solicitation" is the field label whose value is
      # "Not provided by the source". A component can be perfectly wired and
      # still say "Deadline: none stated", which is the exact false claim the
      # phase exists to prevent — so the test reads the DOM.
      #
      # It also pins: Pursue and Submit are ABSENT from a forecast, not disabled
      # (a disabled button that never enables is a promise the surface does not
      # keep); with no action handler the whole action row is absent rather than
      # inert; a signal that could not be EVALUATED renders differently from one
      # evaluated and unmatched; and `formatSourceDate` formats a YYYY-MM-DD from
      # its PARTS, because `new Date('2027-03-01')` parsed as UTC midnight and
      # formatted locally shows 28 February to every reader west of Greenwich.
      #
      # FundingOpportunityInbox.test.tsx grew by 11 (38 -> 49): the flag-ON path
      # (forecast card rendered, forecast rail offered in the source filter, a
      # forecast ref written to the URL, the drawer titled as a forecast) and the
      # flag-OFF path (rail NOT offered, because an empty result from a filter
      # the capability cannot serve reads as "this client has no forecasts";
      # forecast rows WITHHELD with the count stated, because the tab badges
      # still include them and a silent discrepancy reads as a broken filter; and
      # a stale ?source=agency_forecast deep link degrading to ALL sources rather
      # than to an empty list). FundingOpportunityDetail.test.tsx grew by 4
      # (47 -> 51) for the shared route: a forecast deep link renders the
      # forecast body and hits the FORECAST endpoint, and with the flag off it
      # says the CAPABILITY is off rather than that the record is missing — two
      # different facts, and only one of them is about the forecast.
      - name: Assert apps/web scope is clean
        if: always() && steps.scope.outputs.in_scope == 'true'
        run: node scripts/assert-test-summary.mjs "$GITHUB_WORKSPACE/web-summary.json" apps/web 63 274

      # ------------------------------------------------------------- builds --
      # A passing typecheck is not a passing build: the api build runs `nest build`
      # (different module resolution) and the web build runs vite's production
      # transform, and each has caught errors the other did not.
      - name: Build apps/api
        if: steps.scope.outputs.in_scope == 'true'
        run: pnpm --filter @capiro/api build

      - name: Build apps/web
        if: steps.scope.outputs.in_scope == 'true'
        run: pnpm --filter @capiro/web build
