name: phase7-format-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/meriv2-world-class-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 7 files
        run: |
          pnpm exec prettier --write \
            packages/meriv2-core/package.json \
            packages/meriv2-core/src/index.ts \
            packages/meriv2-core/src/registry/types.ts \
            packages/meriv2-core/src/context/contract.ts \
            packages/meriv2-core/src/context/surface-policy.ts \
            packages/meriv2-core/src/context/context-release-switch.ts \
            packages/meriv2-core/src/context/context-release-switch.spec.ts \
            packages/meriv2-core/src/context/truthful-compiler.ts \
            packages/meriv2-core/src/context/truthful-compiler.spec.ts \
            apps/api/src/context/context-compiler.service.ts \
            apps/api/src/context/context-compiler-v2.service.spec.ts \
            apps/api/src/meri/meri-context-packet-view.ts \
            apps/api/src/meri/meri-context-packet.controller.ts \
            apps/api/src/meri/meri-context-packet.controller.spec.ts \
            apps/meriv2-orchestrator/src/meri/context-compiler.service.ts \
            apps/meriv2-orchestrator/src/meri/meri-context.resolver.ts \
            apps/workspace/src/generation/context-compiler.service.ts \
            apps/workspace/src/generation/context-persistence-hold.ts \
            apps/workspace/src/generation/context-persistence-hold.spec.ts \
            apps/workspace/src/generation/generation.controller.ts \
            apps/workspace/src/prisma/prisma.service.ts \
            apps/web/src/components/trust/ContextInspector.tsx \
            apps/web/src/components/trust/ContextInspector.test.tsx
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase7-format-once.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages apps .github/workflows/phase7-format-once.yml
          git commit -m "style(meriv2): format Phase 7 persistence work"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
