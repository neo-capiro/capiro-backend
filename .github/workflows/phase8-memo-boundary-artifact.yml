name: phase8-memo-boundary-artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Phase 8 boundary and typecheck patches
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/intelligence/alert-memo/alert-memo.service.ts')
          text = service.read_text()
          old_import = "import { runAuditor, type LedgerEntry } from '@capiro/meriv2-core';"
          new_import = """import {
            isContextPacketPersistenceError,
            runAuditor,
            type LedgerEntry,
          } from '@capiro/meriv2-core';"""
          if text.count(old_import) != 1:
              raise SystemExit(f'service import count={text.count(old_import)}')
          text = text.replace(old_import, new_import)
          old_log = "      this.logger.debug(`steering compile skipped: ${(err as Error).message}`);"
          new_log = """      if (isContextPacketPersistenceError(err)) throw err;
                this.logger.debug('steering compile skipped (context_compile_failed)');"""
          if text.count(old_log) != 1:
              raise SystemExit(f'service log count={text.count(old_log)}')
          service.write_text(text.replace(old_log, new_log))

          spec = Path('apps/api/src/intelligence/alert-memo/alert-memo.service.spec.ts')
          text = spec.read_text()
          old_import = "import { ServiceUnavailableException } from '@nestjs/common';"
          new_import = """import { ServiceUnavailableException } from '@nestjs/common';
          import { ContextPacketPersistenceError } from '@capiro/meriv2-core';"""
          if text.count(old_import) != 1:
              raise SystemExit(f'spec import count={text.count(old_import)}')
          text = text.replace(old_import, new_import)
          old_opts = """  memoryItem?: unknown;
            billTruthBlock?: () => Promise<unknown>;
          }) {"""
          new_opts = """  memoryItem?: unknown;
            billTruthBlock?: () => Promise<unknown>;
            contextCompileError?: Error;
          }) {"""
          if text.count(old_opts) != 1:
              raise SystemExit(f'spec opts count={text.count(old_opts)}')
          text = text.replace(old_opts, new_opts)
          mock_marker = """  };
            const usageEvents:"""
          mock_patch = """  };
            if (opts.contextCompileError) {
              contextCompiler.compile.mockRejectedValue(opts.contextCompileError);
            }
            const usageEvents:"""
          if text.count(mock_marker) != 1:
              raise SystemExit(f'spec mock marker count={text.count(mock_marker)}')
          text = text.replace(mock_marker, mock_patch, 1)
          marker = """  it('throws before generating (never meters) when no Anthropic credential is available for the tenant', async () => {"""
          test = """  it('holds before generation when required Context Packet persistence fails', async () => {
            const persistenceError = new ContextPacketPersistenceError(
              'context_packet_error',
              'generated-packet-1',
              'memo',
            );
            const { service, credentials, contextCompiler, aiUsageEvents } = makeDeps({
              contextCompileError: persistenceError,
            });
            global.fetch = jest.fn();

            await expect(
              service.generate(
                { tenantId: 't1', userId: 'u1' } as never,
                'client-1',
                FEDERAL_ALERT,
                'Acme Corp',
              ),
            ).rejects.toBe(persistenceError);

            expect(contextCompiler.compile).toHaveBeenCalledTimes(1);
            expect(credentials.resolveProvider).not.toHaveBeenCalled();
            expect(global.fetch).not.toHaveBeenCalled();
            expect(aiUsageEvents).toHaveLength(0);
          });

          """
          if text.count(marker) != 1:
              raise SystemExit(f'spec insertion marker count={text.count(marker)}')
          spec.write_text(text.replace(marker, test + marker))

          orchestrator_spec = Path(
              'apps/meriv2-orchestrator/src/meri/context-compiler-v2.service.spec.ts'
          )
          text = orchestrator_spec.read_text()
          old_jest_import = (
              "import { afterEach, beforeEach, describe, expect, it, jest } "
              "from '@jest/globals';\n"
          )
          if text.count(old_jest_import) != 1:
              raise SystemExit(f'orchestrator jest import count={text.count(old_jest_import)}')
          orchestrator_spec.write_text(text.replace(old_jest_import, '', 1))
          PY
      - name: Format and run targeted checks
        run: |
          pnpm exec prettier --write \
            apps/api/src/intelligence/alert-memo/alert-memo.service.ts \
            apps/api/src/intelligence/alert-memo/alert-memo.service.spec.ts \
            apps/meriv2-orchestrator/src/meri/context-compiler-v2.service.spec.ts
          pnpm --filter @capiro/api exec prisma generate
          pnpm --filter @capiro/meriv2-core build
          pnpm --filter @capiro/meriv2-orchestrator typecheck
          pnpm --filter @capiro/api exec jest --ci --runInBand \
            src/intelligence/alert-memo/alert-memo.service.spec.ts
          pnpm --filter @capiro/meriv2-orchestrator exec jest --ci --runInBand \
            src/meri/context-compiler-v2.service.spec.ts
      - name: Package exact patched files
        run: |
          tar -czf phase8-memo-boundary.tar.gz \
            apps/api/src/intelligence/alert-memo/alert-memo.service.ts \
            apps/api/src/intelligence/alert-memo/alert-memo.service.spec.ts \
            apps/meriv2-orchestrator/src/meri/context-compiler-v2.service.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-memo-boundary
          path: phase8-memo-boundary.tar.gz
          if-no-files-found: error
          retention-days: 1
