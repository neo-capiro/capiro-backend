# Builds the pinned Meri⇄Hermes worker image for linux/arm64 and pushes it to ECR.
#
# This produces a BUILD ARTIFACT ONLY. It deploys nothing, touches no ECS service
# and does not enable the pilot — consistent with api-image.yml's stated policy.
#
# Why this workflow exists (Phase 1 ticket #3): production Fargate tasks in this
# account are ARM64, while the Phase 0 images were linux/amd64 for the local
# harness only. Building arm64 by emulation on a developer laptop takes ~45
# minutes and has failed on low free memory, so the repeatable path is CI on a
# native arm64 runner.
#
# PREREQUISITES that are NOT satisfied by merging this file:
#   1. An ECR repository `capiro/<env>/meri-hermes-worker` must exist. Creating it
#      is part of the authorization ask in
#      docs/meri/hermes/phase-1/deployment-validation-and-rollback.md.
#   2. The OIDC role in vars.AWS_DEV_GHA_ROLE_ARN needs push permission on that
#      repository.
#   3. A bundled-skill license review must be completed before the image is
#      distributed: upstream seeds 58 skills into HERMES_HOME at first boot and
#      only the top-level MIT license was reviewed in Phase 0.
#   4. GitHub-hosted runners for this account have previously been unavailable due
#      to a billing restriction. If `ubuntu-24.04-arm` is not available, the
#      fallback is a self-hosted arm64 runner, or buildx+QEMU on ubuntu-latest
#      with a substantially longer timeout (emulated builds of this image are slow
#      and memory-hungry).
#
# The image is pushed under IMMUTABLE tags only — deliberately no `latest`.
# Task definitions must pin the sha256 digest this workflow prints, never a tag.

name: meri-hermes-worker-image

on:
  push:
    branches: [main]
    paths:
      - 'docker/hermes-worker/**'
      - '.github/workflows/meri-hermes-worker-image.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target env (dev|staging|prod)'
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TARGET_ENV: ${{ github.event.inputs.env || 'dev' }}
  # Pins — these must match docs/meri/hermes/phase-0/pins.md exactly and must not float.
  HERMES_TAG: v2026.9.14
  HERMES_COMMIT: 7a963716b81be13ba513d4f127633b7da493aff2
  HERMES_TARBALL_SHA256: 47df72ebd3f9c96d806a94541163f7fe7d7ce5b84f85c1d3787e6dfeea1d7834

jobs:
  build:
    # Native arm64 avoids QEMU entirely. See prerequisite 4 for fallbacks.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify the pin matches pins.md
        # Fail closed if someone bumps the workflow pin without updating the
        # recorded pin, or vice versa.
        run: |
          set -euo pipefail
          grep -q "$HERMES_TAG" docs/meri/hermes/phase-0/pins.md
          grep -q "$HERMES_COMMIT" docs/meri/hermes/phase-0/pins.md
          grep -q "$HERMES_TARBALL_SHA256" docs/meri/hermes/phase-0/pins.md
          echo "pin matches pins.md"

      - name: Fetch and checksum-verify the pinned upstream source
        # Supply-chain gate: this builds third-party code, so the tarball digest
        # is verified before anything is extracted or executed.
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermes/src
          curl -fsSL -o /tmp/hermes/hermes.tar.gz \
            "https://github.com/NousResearch/hermes-agent/archive/refs/tags/${HERMES_TAG}.tar.gz"
          echo "${HERMES_TARBALL_SHA256}  /tmp/hermes/hermes.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hermes/hermes.tar.gz -C /tmp/hermes/src --strip-components=1
          grep -q '^version = "0.21.3"' /tmp/hermes/src/pyproject.toml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_ENV == 'prod' && vars.AWS_PROD_GHA_ROLE_ARN || vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the pinned upstream base (arm64, local only)
        uses: docker/build-push-action@v6
        with:
          context: /tmp/hermes/src
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: meri-hermes-base:${{ env.HERMES_TAG }}
          cache-from: type=gha,scope=hermes-base
          cache-to: type=gha,mode=max,scope=hermes-base

      - name: Build and push the Meri worker layer (arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docker/hermes-worker
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            HERMES_BASE_IMAGE=meri-hermes-base:${{ env.HERMES_TAG }}
          # Immutable tags only — no `latest`. Task definitions pin the digest.
          tags: |
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/meri-hermes-worker:${{ env.HERMES_TAG }}-meri-${{ github.sha }}
          cache-from: type=gha,scope=hermes-worker
          cache-to: type=gha,mode=max,scope=hermes-worker

      - name: Output the immutable digest to pin
        run: |
          echo "Pin this digest in the task definition and in pins.md:"
          echo "  ${{ steps.push.outputs.digest }}"
