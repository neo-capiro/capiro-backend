name: phase8-surface-release-patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/meriv2-world-class-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Audit Phase 8 surface call sites
        run: |
          grep -RInE "surface:[[:space:]]*['\"](outreach|memo|district-brief|research)['\"]" apps packages || true
      - name: Patch required memo persistence boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          service = Path('apps/api/src/intelligence/alert-memo/alert-memo.service.ts')
          text = service.read_text()
          pattern = re.compile(
              r"    \} catch \(err\) \{\n\s+this\.logger\.debug\(`steering compile skipped: \$\{\(err as Error\)\.message\}`\);\n\s+\}"
          )
          replacement = """    } catch (err) {
              if (
                err &&
                typeof err === 'object' &&
                (err as { name?: unknown }).name === 'ContextPacketPersistenceError'
              ) {
                throw err;
              }
              this.logger.debug('steering compile skipped (context_compile_failed)');
            }"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'alert memo catch replacement count={count}')
          service.write_text(text)

          spec = Path('apps/api/src/intelligence/alert-memo/alert-memo.service.spec.ts')
          text = spec.read_text()
          old_opts = "  billTruthBlock?: () => Promise<unknown>;\n}) {"
          new_opts = "  billTruthBlock?: () => Promise<unknown>;\n  contextCompileError?: Error;\n}) {"
          if text.count(old_opts) != 1:
              raise SystemExit(f'opts replacement count={text.count(old_opts)}')
          text = text.replace(old_opts, new_opts)

          compile_pattern = re.compile(
              r"  const contextCompiler = \{\n    compile: jest\.fn\(async \(\) =>\n      opts\.memoryItem\n        \? \{"
          )
          text, count = compile_pattern.subn(
              """  const contextCompiler = {
              compile: jest.fn(async () => {
                if (opts.contextCompileError) throw opts.contextCompileError;
                return opts.memoryItem
                  ? {""",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'compile start replacement count={count}')

          old_end = "          : { packetId: 'pkt-1', rendered: [], items: [], exclusions: [] },\n    ),\n  };"
          new_end = "          : { packetId: 'pkt-1', rendered: [], items: [], exclusions: [] };\n    }),\n  };"
          if text.count(old_end) != 1:
              raise SystemExit(f'compile end replacement count={text.count(old_end)}')
          text = text.replace(old_end, new_end)

          marker = "  it('throws before generating (never meters) when no Anthropic credential is available for the tenant', async () => {"
          if text.count(marker) != 1:
              raise SystemExit(f'test insertion marker count={text.count(marker)}')
          test = """  it('holds before generation when required Context Packet persistence fails', async () => {
              const persistenceError = Object.assign(new Error('bounded persistence failure'), {
                name: 'ContextPacketPersistenceError',
                code: 'context_packet_error',
              });
              const { service, aiUsageEvents, engagement } = makeDeps({
                contextCompileError: persistenceError,
              });
              global.fetch = jest.fn();

              await expect(
                service.generate(
                  { tenantId: 't1', userId: 'u1' } as never,
                  'client-1',
                  FEDERAL_ALERT,
                  'Acme Corp',
                ),
              ).rejects.toBe(persistenceError);

              expect(global.fetch).not.toHaveBeenCalled();
              expect(engagement.createAttachmentFromBuffer).not.toHaveBeenCalled();
              expect(aiUsageEvents).toHaveLength(0);
            });

          """
          spec.write_text(text.replace(marker, test + marker))
          PY
      - name: Format and self-delete
        run: |
          pnpm exec prettier --write \
            apps/api/src/intelligence/alert-memo/alert-memo.service.ts \
            apps/api/src/intelligence/alert-memo/alert-memo.service.spec.ts
          rm .github/workflows/phase8-surface-release-patch.yml
      - name: Commit exact patch
        run: |
          git config user.name "Capiro Closeout Agent"
          git config user.email "noreply@capiro.ai"
          git add apps/api/src/intelligence/alert-memo/alert-memo.service.ts \
                  apps/api/src/intelligence/alert-memo/alert-memo.service.spec.ts \
                  .github/workflows/phase8-surface-release-patch.yml
          git commit -m "fix(meriv2): hold memo on required context persistence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
