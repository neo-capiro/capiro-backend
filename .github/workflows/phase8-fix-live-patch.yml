name: phase8-fix-live-patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/meriv2-world-class-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Preserve replacement backslashes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/phase8-live-surface-patch.yml')
          text = p.read_text()
          old = 'text, count = method_pattern.subn(method_new, text, count=1)'
          new = 'text, count = method_pattern.subn(lambda _match: method_new, text, count=1)'
          if text.count(old) != 1:
              raise SystemExit(f'replacement count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/phase8-fix-live-patch.yml
      - name: Commit
        run: |
          git config user.name "Capiro Closeout Agent"
          git config user.email "noreply@capiro.ai"
          git add .github/workflows/phase8-live-surface-patch.yml .github/workflows/phase8-fix-live-patch.yml
          git commit -m "fix(meriv2): preserve live-patch replacement escapes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
