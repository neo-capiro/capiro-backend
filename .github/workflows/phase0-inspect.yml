name: MeriV2 Phase 0 Core Apply

on:
  push:
    branches:
      - fix/meriv2-p0-control-boundaries
    paths:
      - .github/workflows/phase0-inspect.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meriv2-p0-control-boundaries
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply core, schema, and configuration changes
        run: node .github/scripts/phase0-core-apply.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate generated client and core package
        shell: bash
        run: |
          set +e
          mkdir -p docs/engineering
          : > /tmp/phase0-core-validation.txt
          run_check() {
            echo "$ $*" | tee -a /tmp/phase0-core-validation.txt
            "$@" 2>&1 | tee -a /tmp/phase0-core-validation.txt
            code=${PIPESTATUS[0]}
            echo "exit_code=$code" | tee -a /tmp/phase0-core-validation.txt
            return $code
          }
          failed=0
          run_check pnpm --filter @capiro/api prisma:generate || failed=1
          run_check pnpm --filter @capiro/meriv2-core typecheck || failed=1
          run_check pnpm --filter @capiro/meriv2-core test || failed=1
          {
            echo "# MeriV2 Phase 0 Core Validation"
            echo
            echo "Base commit: 1cdd372f0409986ac238beef2c4e9f310925fb37"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Result: $([ "$failed" -eq 0 ] && echo PASS || echo FAIL)"
            echo
            echo '```text'
            cat /tmp/phase0-core-validation.txt
            echo '```'
          } > docs/engineering/meriv2-phase0-core-validation.md
          echo "PHASE0_CORE_FAILED=$failed" >> "$GITHUB_ENV"
      - name: Commit branch-only implementation
        shell: bash
        run: |
          rm -f .phase0-inspect-output.txt
          rm -f .github/scripts/phase0-core-apply.mjs
          rm -f .github/workflows/phase0-core-apply.yml
          rm -f .github/workflows/phase0-inspect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(meriv2): add phase 0 proposal authority foundation [skip ci]"
          git push origin HEAD:fix/meriv2-p0-control-boundaries
      - name: Fail validation run when checks failed
        if: env.PHASE0_CORE_FAILED == '1'
        run: exit 1
