name: MeriV2 Phase 0 Inspection

on:
  push:
    branches:
      - fix/meriv2-p0-control-boundaries
    paths:
      - .github/workflows/phase0-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meriv2-p0-control-boundaries
      - name: Capture Phase 0 call sites
        shell: bash
        run: |
          node <<'NODE' > .phase0-inspect-output.txt
          const fs = require('node:fs');

          function show(file, needles, before = 10, after = 45) {
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            console.log(`\n===== ${file} (${lines.length} lines) =====`);
            for (const needle of needles) {
              const matches = [];
              lines.forEach((line, index) => {
                if (line.includes(needle)) matches.push(index);
              });
              console.log(`\n--- needle: ${needle} matches=${matches.map(i => i + 1).join(',') || 'none'} ---`);
              for (const index of matches.slice(0, 4)) {
                const start = Math.max(0, index - before);
                const end = Math.min(lines.length, index + after + 1);
                for (let i = start; i < end; i += 1) {
                  console.log(`${String(i + 1).padStart(5)} | ${lines[i]}`);
                }
              }
            }
          }

          show('apps/api/src/meri/meri.service.ts', [
            'async streamMessage(',
            'maybeLearnFromConversation(',
            'async listRecentLearnedMemories(',
            'async listMemories(',
            'async forgetMemory(',
            'async updateMemory(',
            'meriV2Chat.streamChat(',
            'MEMORY_AUTOLEARN_GOVERNED',
          ]);

          show('apps/api/src/meri/meri-tools.service.ts', [
            'isSideEffecting(',
            'anthropicToolSchemas(',
            'executeFromAuthenticatedUser(',
            'async execute(',
            'async saveMemory(',
            "case 'confirm_memory'",
            "case 'correct_memory'",
            "case 'forget_memory'",
          ]);

          show('apps/web/src/components/chat/useMeriChatController.ts', [
            'pending_approval',
            'approvals/approve',
            'fingerprint',
            'approve',
          ]);

          show('apps/web/src/components/chat/ChatDrawer.tsx', [
            'pendingApprovals',
            'pendingApproval',
            'Approve',
            'fingerprint',
          ]);

          show('apps/web/src/components/chat/meri-pending-approvals.ts', [
            'export',
            'fingerprint',
            'pending',
          ]);

          show('apps/api/src/tenant/tenant-context.store.ts', ['export', 'interface', 'actorUserId', 'impersonation'], 8, 35);
          show('packages/shared/src/index.ts', ['TenantContext'], 8, 35);
          NODE
      - name: Commit inspection output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .phase0-inspect-output.txt
          git commit -m "chore(meriv2): capture phase 0 call sites [skip ci]"
          git push origin HEAD:fix/meriv2-p0-control-boundaries