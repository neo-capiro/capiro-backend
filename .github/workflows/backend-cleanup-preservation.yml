{
  "name": "Backend artifact source contracts",
  "on": {
    "pull_request": {
      "paths": [
        "package.json",
        "pnpm-workspace.yaml",
        "pnpm-lock.yaml",
        "apps/**",
        "packages/**",
        "scripts/**",
        "infra/**",
        "tests/**",
        "docs/**",
        ".github/workflows/**"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "artifact-source-contracts": {
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Check the receiving source job and unchanged deployment defaults",
          "run": "python3 scripts/ci/backend-retirement-source-jobs.contract.spec.py"
        },
        {
          "name": "Check exact reviewed manifest changes and raw archive classification",
          "run": "node --test scripts/ci/reviewed-pe-manifest-contract.spec.mjs scripts/ci/reviewed-source-hygiene.spec.mjs"
        },
        {
          "name": "Check source and normal documentation whitespace with immutable raw observations classified",
          "run": "node scripts/lib/reviewed-source-hygiene.mjs --run --base b7aa1d6e6b341f833fa08b2add8f40d5fbee8480"
        },
        {
          "name": "Exercise owned migration discovery and inert Docker fixture controls",
          "run": "node --test apps/api/scripts/lib/pe-phase-9-migration-discovery.spec.mjs apps/api/scripts/lib/pe-phase-9-owned-postgres.spec.mjs"
        },
        {
          "name": "Exercise standalone assembly and Docker consumer refusals",
          "run": "node --test scripts/ci/frontend-artifact-docker.contract.spec.mjs scripts/ci/frontend-standalone-artifact.contract.spec.mjs scripts/ci/newsletter-artifact-packaging-plan.spec.mjs scripts/ci/newsletter-accepted-source-profile.spec.mjs"
        },
        {
          "name": "Preserve static artifact owner contracts",
          "run": "node --test scripts/ci/onboard-spa-artifact.contract.spec.mjs scripts/ci/newsletter-static-release.contract.spec.mjs"
        },
        {
          "name": "Preserve reviewed backend retirement and command scopes",
          "run": "node --test scripts/ci/florida-owned-portrait-release.spec.mjs scripts/ci/defense-backend-workspace.contract.spec.mjs scripts/ci/engagement-resilience-recovery.contract.spec.mjs scripts/ci/context-plane-scope.contract.spec.mjs scripts/ci/context-plane-validation-scope.spec.mjs scripts/ci/rebuild-verification-scopes.spec.mjs"
        },
        {
          "name": "Preserve current-source edge declarations and header refusal",
          "run": "node --test scripts/ci/newsletter-declared-edge.contract.spec.mjs"
        },
        {
          "name": "Exercise isolated loopback fixtures with synthetic asset identities",
          "run": "node --test scripts/ci/newsletter-loopback-serving.spec.mjs"
        }
      ]
    }
  }
}
