name: MeriV2 Phase 0 API Boundary

on:
  push:
    branches:
      - fix/meriv2-p0-control-boundaries
    paths:
      - .github/workflows/phase0-api-wire.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meriv2-p0-control-boundaries
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: node .github/scripts/phase0-api-wire.mjs
      - run: pnpm install --frozen-lockfile
      - name: Validate API authority boundary
        shell: bash
        run: |
          set +e
          mkdir -p docs/engineering
          : > /tmp/phase0-api-validation.txt
          run_check() {
            echo "$ $*" | tee -a /tmp/phase0-api-validation.txt
            "$@" 2>&1 | tee -a /tmp/phase0-api-validation.txt
            code=${PIPESTATUS[0]}
            echo "exit_code=$code" | tee -a /tmp/phase0-api-validation.txt
            return $code
          }
          failed=0
          run_check pnpm --filter @capiro/shared build || failed=1
          run_check pnpm --filter @capiro/meriv2-core build || failed=1
          run_check pnpm --filter @capiro/api prisma:generate || failed=1
          run_check pnpm --filter @capiro/meriv2-core typecheck || failed=1
          run_check pnpm --filter @capiro/meriv2-core test -- --runInBand src/compliance/action-approval.spec.ts src/compliance/compliance-rules.spec.ts || failed=1
          run_check pnpm --filter @capiro/api typecheck || failed=1
          run_check pnpm --filter @capiro/api test -- --runInBand src/meri/meri-write-tool-input.spec.ts src/meri/tool-service-secret.guard.spec.ts src/meri/meri-approval.service.spec.ts || failed=1
          {
            echo "# MeriV2 Phase 0 API Boundary Validation"
            echo
            echo "Base commit: 1cdd372f0409986ac238beef2c4e9f310925fb37"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Result: $([ "$failed" -eq 0 ] && echo PASS || echo FAIL)"
            echo
            echo '```text'
            cat /tmp/phase0-api-validation.txt
            echo '```'
          } > docs/engineering/meriv2-phase0-api-validation.md
          echo "PHASE0_API_FAILED=$failed" >> "$GITHUB_ENV"
      - name: Commit implementation and evidence to branch
        shell: bash
        run: |
          rm -f .github/scripts/phase0-api-wire.mjs
          rm -f .github/workflows/phase0-api-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(meriv2): enforce immutable API action proposals [skip ci]"
          git push origin HEAD:fix/meriv2-p0-control-boundaries
      - name: Preserve failing validation status
        if: env.PHASE0_API_FAILED == '1'
        run: exit 1
