name: meriv2-phase10-policy-authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify focused Phase 10 gate is registered
        run: test -f apps/api/src/meri/meri-policy-pack.service.ts
