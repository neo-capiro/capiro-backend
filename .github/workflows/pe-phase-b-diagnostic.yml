name: pe-phase-b-diagnostic

on:
  pull_request:
    branches: [agent/pe-trust-phase-b-ci-base]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: python apps/api/scripts/__phase_b_apply_patch.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @capiro/api exec prisma generate
      - run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/meriv2-core build
          pnpm --filter @capiro/shared typecheck
      - name: Capture API typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @capiro/api typecheck 2>&1 | tee /tmp/pe-phase-b-typecheck.log
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pe-phase-b-compiler-log
          path: /tmp/pe-phase-b-typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce compiler result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
