name: phase10-prettier-fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase10-prettier-fix.yml

permissions:
  contents: write

jobs:
  format-phase10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 10 source files
        run: |
          pnpm exec prettier --write \
            packages/meriv2-core/src/assurance/policy-pack.ts \
            apps/meriv2-orchestrator/src/meri/api-action-proposal.repo.ts \
            apps/meriv2-orchestrator/src/meri/chat/chat-assistant.service.ts
          git config user.name "capiro-phase10-bot"
          git config user.email "noreply@capiro.ai"
          git add \
            packages/meriv2-core/src/assurance/policy-pack.ts \
            apps/meriv2-orchestrator/src/meri/api-action-proposal.repo.ts \
            apps/meriv2-orchestrator/src/meri/chat/chat-assistant.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(meriv2): format Phase 10 policy authority"
          git push origin HEAD:agent/meriv2-world-class-closeout
