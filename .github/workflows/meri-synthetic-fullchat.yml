name: meri-synthetic-fullchat

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan is DB-read-only; apply/rollback require an exact source receipt and confirmation'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - rollback
      source_run_id:
        description: 'Apply: exact plan run ID. Rollback: exact apply run ID.'
        required: false
        default: ''
      source_run_attempt:
        description: 'Exact source workflow run attempt.'
        required: false
        default: ''
      build_run_id:
        description: 'Exact successful api-image build run ID for the current API/diag image.'
        required: true
      build_run_attempt:
        description: 'Exact successful api-image build run attempt.'
        required: true
      apply_confirmation:
        description: 'Apply only: APPLY_FIXED_MERI_FOUNDATION_FULLCHAT'
        required: false
        default: ''
      rollback_confirmation:
        description: 'Rollback only: ROLLBACK_FIXED_MERI_FOUNDATION_FULLCHAT'
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: meri-synthetic-fullchat-capiro-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  OUTPUT_DIR: /tmp/meri-synthetic-fullchat
  METADATA_DIR: /tmp/meri-synthetic-fullchat-metadata
  INPUT_MODE: ${{ inputs.mode }}
  INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  INPUT_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
  INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
  INPUT_BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
  INPUT_APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
  INPUT_ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}

jobs:
  fixed-foundation-fullchat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Refuse every repository/ref except merged main
        if: github.repository != 'neo-capiro/capirov2' || github.ref != 'refs/heads/main'
        run: |
          echo 'This workflow may run only from neo-capiro/capirov2 main.' >&2
          exit 2

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove current complete merged main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Run fixed-path offline guards
        run: python3 scripts/meri-synthetic-fullchat.test.py

      - name: Select exact authenticated build artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INPUT_BUILD_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$METADATA_DIR"
          python3 scripts/meri-synthetic-fullchat.py \
            --select-build-artifact \
            --build-run-id "$INPUT_BUILD_RUN_ID" \
            --build-run-attempt "$INPUT_BUILD_RUN_ATTEMPT" \
            --build-artifact-selection "$METADATA_DIR/build-selection.json"

      - name: Select exact authenticated source artifact
        if: inputs.mode != 'plan'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INPUT_SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          python3 scripts/meri-synthetic-fullchat.py \
            --select-source-artifact \
            --source-run-id "$INPUT_SOURCE_RUN_ID" \
            --source-run-attempt "$INPUT_SOURCE_RUN_ATTEMPT" \
            --artifact-selection "$METADATA_DIR/selection.json"

      - name: Bounded download of validated build record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(python3 -c 'import json,os; print(json.load(open(os.environ["METADATA_DIR"] + "/build-selection.json", encoding="utf-8"))["artifactId"])')"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          curl --fail --silent --show-error --location --max-filesize 1048576 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$METADATA_DIR/build-artifact.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          [[ "$(stat -c%s "$METADATA_DIR/build-artifact.zip")" -le 1048576 ]]

      - name: Bounded download of validated source receipt
        if: inputs.mode != 'plan'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(python3 -c 'import json,os; print(json.load(open(os.environ["METADATA_DIR"] + "/selection.json", encoding="utf-8"))["artifactId"])')"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          curl --fail --silent --show-error --location --max-filesize 1048576 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$METADATA_DIR/artifact.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          [[ "$(stat -c%s "$METADATA_DIR/artifact.zip")" -le 1048576 ]]

      - name: Configure fixed dev AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run fixed owner command and require exact readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --mode "$INPUT_MODE"
            --apply-confirmation "$INPUT_APPLY_CONFIRMATION"
            --rollback-confirmation "$INPUT_ROLLBACK_CONFIRMATION"
            --source-run-id "$INPUT_SOURCE_RUN_ID"
            --source-run-attempt "$INPUT_SOURCE_RUN_ATTEMPT"
            --build-run-id "$INPUT_BUILD_RUN_ID"
            --build-run-attempt "$INPUT_BUILD_RUN_ATTEMPT"
            --build-artifact-selection "$METADATA_DIR/build-selection.json"
            --build-artifact-archive "$METADATA_DIR/build-artifact.zip"
            --output-dir "$OUTPUT_DIR"
            --wait-timeout-seconds 900
          )
          if [[ "$INPUT_MODE" != plan ]]; then
            args+=(
              --artifact-selection "$METADATA_DIR/selection.json"
              --artifact-archive "$METADATA_DIR/artifact.zip"
            )
          fi
          python3 scripts/meri-synthetic-fullchat.py "${args[@]}"

      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-fullchat-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/meri-synthetic-fullchat/receipt.json
          if-no-files-found: warn
          retention-days: 30
