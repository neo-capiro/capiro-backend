# Builds the API container image and pushes it to ECR.
# Push to main builds/pushes image and triggers *dev* ECS deployment by default.
# Manual workflow_dispatch input can target staging/prod environments.
#
# Auth uses OIDC -> assume role in the AWS account. Configure once:
#   - Add an IAM role `capiro-gha-api` in the AWS account with a trust policy
#     for token.actions.githubusercontent.com that scopes by repo + ref.
#   - Grant it ecr:GetAuthorizationToken + push permissions on the api repo.
#   - Set the role ARN in the repository variable AWS_GHA_ROLE_ARN.

name: api-image

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target env (dev|staging|prod)'
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TARGET_ENV: ${{ github.event.inputs.env || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_ENV == 'prod' && vars.AWS_PROD_GHA_ROLE_ARN || vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Output image digest
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed ${ECR_REGISTRY}/capiro/${TARGET_ENV}/api@${IMAGE_DIGEST} (tag ${GITHUB_SHA})"

      - name: Create API image build record
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          export CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          python scripts/api-image-build-record.py

      - name: Upload API image build record
        uses: actions/upload-artifact@v4
        with:
          name: api-image-build-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: api-image-build-record.json
          if-no-files-found: error

      - name: Deploy to ECS
        shell: bash
        run: |
          set -euo pipefail
          ECS_CLUSTER="capiro-${TARGET_ENV}"
          ECS_SERVICE="capiro-${TARGET_ENV}-api"
          echo "Deploying to $ECS_CLUSTER / $ECS_SERVICE ..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query "service.{status:status,runningCount:runningCount,desiredCount:desiredCount}" \
            --output table

      - name: Wait for service stability
        shell: bash
        run: |
          set -euo pipefail
          ECS_CLUSTER="capiro-${TARGET_ENV}"
          ECS_SERVICE="capiro-${TARGET_ENV}-api"
          echo "Waiting for $ECS_SERVICE to stabilize (up to 10 min)..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].{status:status,runningCount:runningCount,desiredCount:desiredCount,pendingCount:pendingCount}" \
            --output table

