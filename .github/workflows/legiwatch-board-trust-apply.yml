name: legiwatch-board-trust-apply

on:
  push:
    branches: [agent/legiwatch-audit-fixes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legiwatch-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-legiwatch-board-trust-patches.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-legiwatch-board-trust-patches.py
          rm .github/workflows/legiwatch-board-trust-apply.yml
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/pages/radar/RadarPage.tsx \
            apps/web/src/pages/radar/RadarPage.test.tsx \
            scripts/apply-legiwatch-board-trust-patches.py \
            .github/workflows/legiwatch-board-trust-apply.yml
          git diff --cached --check
          git commit -m 'fix(legiwatch): honor priority and change-tone facts'
          git push origin HEAD:agent/legiwatch-audit-fixes
