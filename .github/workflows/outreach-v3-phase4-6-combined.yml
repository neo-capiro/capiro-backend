name: Outreach V3 Phase 4-6 Combined

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/src/capabilities/targets/**'
      - 'apps/api/src/outreach-v3/**'
      - 'apps/web/src/pages/engagement/outreach/v3/**'
      - 'apps/web/src/pages/engagement/OutreachView.tsx'
      - 'apps/web/src/lib/engagement-api-preview*'
      - 'docs/plans/outreach-v3/**'
      - 'scripts/verify-outreach-v3-phase4-6-combined.mjs'
      - 'scripts/verify-outreach-v3-phase4-code.mjs'
      - 'scripts/verify-outreach-v3-phase5-code.mjs'
      - 'scripts/verify-outreach-v3-phase6-code.mjs'
      - '.github/workflows/outreach-v3-phase4-6-combined.yml'

permissions:
  contents: read

concurrency:
  group: outreach-v3-phase4-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-code:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    # Phase 4 re-runs Phase 3, which re-runs Engagement Phase 1-3 (Phase 1
    # twice); the same budget as the Revised Phase 2/3 DB-free jobs.
    # Ran 120 min on PR #1905 and was killed during its last step (the full web
    # suite, ~25 min), after every earlier step passed.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          # 22 like the other web gates: Node 20's WebCrypto rejects the
          # jsdom-realm ArrayBuffers the Meri artifact download tests hash.
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds shared and MeriV2 core plus every other declared verification
      # workspace dependency before the gate typechecks and tests.
      - name: Build verification workspace prerequisites
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/defense-contracts build
          pnpm --filter @capiro/defense-domain build
          pnpm --filter @capiro/auth build
          pnpm --filter @capiro/strategy-verifier build
          pnpm --filter @capiro/meriv2-core build

      - name: Prisma generate
        run: pnpm --filter @capiro/api exec prisma generate

      - name: Combined Phase 4-6 code gate
        run: node scripts/verify-outreach-v3-phase4-6-combined.mjs --sha "$(git rev-parse HEAD)"
