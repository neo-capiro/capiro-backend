# ONE-SHOT Phase 5 integration wrapper. The first step restores the permanent
# governance gate from HEAD^ in the same product commit before validation.
name: memory-governance-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  governed-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
      - name: Apply bounded Phase 5 integration and restore permanent gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Capiro Closeout Agent'
          git config user.email 'noreply@capiro.ai'
          python - <<'PY'
          from pathlib import Path

          schema = Path('apps/api/prisma/schema.prisma')
          text = schema.read_text()
          old_comment = "///   CHECK memory_cleanup_status_check (status IN ('pending','running','completed','failed'))"
          new_comment = "///   CHECK memory_cleanup_status_check (status IN ('pending','running','completed','failed','dead_letter'))"
          old_fields = '''  attempts       Int       @default(0)
  nextAttemptAt  DateTime  @default(now()) @map("next_attempt_at") @db.Timestamptz(6)
  lastError      String?   @map("last_error")
  createdAt      DateTime  @default(now()) @map("created_at") @db.Timestamptz(6)
  completedAt    DateTime? @map("completed_at") @db.Timestamptz(6)'''
          new_fields = '''  attempts        Int       @default(0)
  nextAttemptAt   DateTime  @default(now()) @map("next_attempt_at") @db.Timestamptz(6)
  lastError       String?   @map("last_error")
  leaseOwner      String?   @map("lease_owner") @db.VarChar(80)
  leaseExpiresAt  DateTime? @map("lease_expires_at") @db.Timestamptz(6)
  startedAt       DateTime? @map("started_at") @db.Timestamptz(6)
  deadLetteredAt  DateTime? @map("dead_lettered_at") @db.Timestamptz(6)
  createdAt       DateTime  @default(now()) @map("created_at") @db.Timestamptz(6)
  completedAt     DateTime? @map("completed_at") @db.Timestamptz(6)'''
          if text.count(old_comment) != 1 or text.count(old_fields) != 1:
              raise SystemExit('Prisma outbox model drifted; refusing blind patch')
          schema.write_text(text.replace(old_comment, new_comment, 1).replace(old_fields, new_fields, 1))

          compute = Path('infra/cdk/lib/compute-stack.ts')
          text = compute.read_text()
          old_import = "import { ScheduledIngestionJobs } from './constructs/scheduled-ingestion-jobs';"
          new_import = old_import + "\nimport { ScheduledMemoryProjectionWorker } from './constructs/scheduled-memory-projection-worker';"
          anchor = '''    new ScheduledIngestionJobs(this, 'IngestionSchedules', {
      envName: cfg.envName,
      cluster: this.cluster,
      taskDefinition: syncJobsTaskDef,
      containerName: 'api-sync-jobs',
      securityGroup: serviceSecurityGroup,
      jobs: INGESTION_JOBS,
    });'''
          insertion = anchor + '''

    // Phase 5 — durable governed-memory projection/index worker. This is a
    // separate short-lived task, not an in-process cron and not the broad sync
    // role: app DB credential, Titan embedding permission, dedicated logs/alarms.
    new ScheduledMemoryProjectionWorker(this, 'MemoryProjectionWorker', {
      envName: cfg.envName,
      cluster: this.cluster,
      apiRepo: this.apiRepo,
      securityGroup: serviceSecurityGroup,
      dbSecret: dbSecretImported,
      appDbSecret: appDbSecretImported,
      databaseName,
      dataKeyArn: dataKey.keyArn,
      secretsKeyArn: secretsStack.secretsKey.keyArn,
      region: this.region,
      account: this.account,
      protectFromDestroy: cfg.protectFromDestroy,
    });'''
          if text.count(old_import) != 1 or text.count(anchor) != 1:
              raise SystemExit('Compute stack anchors drifted; refusing blind patch')
          compute.write_text(text.replace(old_import, new_import, 1).replace(anchor, insertion, 1))
          PY
          git show HEAD^:.github/workflows/memory-governance-ci.yml > .github/workflows/memory-governance-ci.yml
          git rm -f .github/workflows/meriv2-phase5-integration-runner.yml || true
          git rm -f docs/tmp/meriv2-phase5-large-file-patch-trigger.txt || true
          git add apps/api/prisma/schema.prisma infra/cdk/lib/compute-stack.ts
          git add -A
          git diff --cached --check
          git commit -m 'wire scheduled governed-memory projection worker'
          git push origin HEAD:agent/meriv2-world-class-closeout
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate API Prisma client
        run: pnpm --filter @capiro/api exec prisma generate
      - name: Typecheck API and workspace dependencies
        run: pnpm turbo run typecheck --filter=@capiro/api
      - name: Typecheck worker infrastructure
        run: pnpm --filter @capiro/infra-cdk typecheck
      - name: Test governed memory lifecycle and projection worker
        run: >
          pnpm --filter @capiro/api exec jest --ci --silent --runInBand
          src/memory/memory-version.helpers.spec.ts
          src/memory/immutable-memory-version.service.spec.ts
          src/prisma/migration-memory-immutable-versions.spec.ts
          src/memory/memory-candidate.atomicity.spec.ts
          src/meri/governed-meri-tools.proxy.spec.ts
          src/memory/memory-projection-worker.service.spec.ts
          src/memory/strict-memory-projector.service.spec.ts
          src/prisma/migration-memory-cleanup-worker-leases.spec.ts
