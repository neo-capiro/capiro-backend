name: meriv3-canary-ci

on:
  push:
    branches:
      - agent/meriv3-openai-responses-canary
      - agent/meriv3-managed-connectors-hubspot-airtable
    paths:
      - 'apps/api/src/meri/**'
      - 'apps/api/src/common/meriv3-*'
      - 'apps/api/src/users/users.controller.ts'
      - 'apps/api/src/capiro-admin/meriv3-*'
      - 'apps/api/src/capiro-admin/capiro-admin.module.ts'
      - 'apps/meriv2-orchestrator/src/meri/**'
      - 'apps/web/public/meri-icons/**'
      - 'apps/web/public/meri-manifest.json'
      - 'apps/web/src/components/chat/**'
      - 'apps/web/src/vnext/meri/**'
      - 'apps/web/src/lib/me.ts'
      - 'docs/plans/meriv3-*'
      - 'docs/runbooks/meriv3-*'
      - '.github/workflows/meriv3-canary-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/meri/**'
      - 'apps/api/src/common/meriv3-*'
      - 'apps/api/src/users/users.controller.ts'
      - 'apps/api/src/capiro-admin/meriv3-*'
      - 'apps/api/src/capiro-admin/capiro-admin.module.ts'
      - 'apps/meriv2-orchestrator/src/meri/**'
      - 'apps/web/public/meri-icons/**'
      - 'apps/web/public/meri-manifest.json'
      - 'apps/web/src/components/chat/**'
      - 'apps/web/src/vnext/meri/**'
      - 'apps/web/src/lib/me.ts'
      - 'docs/plans/meriv3-*'
      - 'docs/runbooks/meriv3-*'
      - '.github/workflows/meriv3-canary-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meriv3-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter @capiro/api exec prisma generate
          pnpm --filter @capiro/workspace exec prisma generate
          pnpm --filter @capiro/intel-api exec prisma generate
          pnpm --filter @capiro/onboard-api exec prisma generate
          pnpm --filter @capiro/api-strategy exec prisma generate

      - name: Format gate — changed files in MeriV3 scope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD^)
          fi
          mapfile -d '' -t files < <(git diff --name-only -z --diff-filter=ACMR "$base...HEAD" -- \
            'apps/meriv2-orchestrator/src/meri/meriv3/**' \
            'apps/meriv2-orchestrator/src/meri/meri.module.ts' \
            'apps/api/src/meri/meriv3*.ts' \
            'apps/api/src/meri/meri-managed-mcp*.ts' \
            'apps/api/src/meri/meri-mcp-oauth.controller.ts' \
            'apps/api/src/meri/meri.module.ts' \
            'apps/api/src/common/meriv3*.ts' \
            'apps/api/src/capiro-admin/meriv3*.ts' \
            'apps/api/src/capiro-admin/capiro-admin.module.ts' \
            'apps/api/src/users/users.controller.ts' \
            'apps/web/src/components/chat/**' \
            'apps/web/src/lib/me.ts' \
            'docs/plans/meriv3-*' \
            'docs/runbooks/meriv3-*' \
            '.github/workflows/meriv3-canary-ci.yml')
          if (( ${#files[@]} == 0 )); then
            echo 'No changed files in the MeriV3 formatting scope.'
          else
            pnpm exec prettier --check "${files[@]}"
          fi

      - name: Build shared package prerequisites
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/auth build
          pnpm --filter @capiro/meriv2-core build
          # meriv2-orchestrator's strategy module imports this package; without
          # its dist the orchestrator typecheck and `nest build` both fail.
          pnpm --filter @capiro/strategy-verifier build

      - name: Typecheck MeriV3 deployables
        run: |
          pnpm --filter @capiro/meriv2-orchestrator typecheck
          pnpm --filter @capiro/api exec tsc --noEmit
          pnpm --filter @capiro/web typecheck

      - name: Test isolated MeriV3 runtime
        run: >
          pnpm --filter @capiro/meriv2-orchestrator exec jest
          --runInBand --forceExit
          src/meri/meriv3
          src/meri/api-tool-executor-cancellation.spec.ts
          src/meri/meri-capability-contract.spec.ts
          src/meri/full-chat-read-tools.catalog.spec.ts
          src/meri/api-client-context.repo.spec.ts
          src/meri/shared-retrieval-citations.spec.ts
          src/meri/chat/chat-prompt.spec.ts

      - name: Test API routing, flags, transport and managed apps
        run: >
          pnpm --filter @capiro/api exec jest
          --runInBand --forceExit
          src/meri/meriv3-chat.client.spec.ts
          src/meri/meriv3-context-transport.spec.ts
          src/meri/meriv3-runtime.proxy.spec.ts
          src/meri/meriv3-conversation.helpers.spec.ts
          src/meri/meri-managed-mcp.helpers.spec.ts
          src/meri/meri-managed-mcp.service.spec.ts
          src/common/meriv3-flags.spec.ts

      - name: Test capability, retrieval and conversation continuity contracts
        run: >
          pnpm --filter @capiro/api exec jest
          --runInBand --forceExit
          src/meri/meri-tools.registration.spec.ts
          src/meri/meri-tool-manifest.parity.spec.ts
          src/meri/meri-tools.firmdata.spec.ts
          src/meri/meri-client-context.helpers.spec.ts
          src/clients/client-advocacy-record-read.service.spec.ts
          src/meri/evals/government-affairs-grader.spec.ts
          src/funding-opportunities/meri-opportunity-tools.spec.ts
          src/funding-opportunities/requirements/opportunity-requirement.spec.ts
          src/funding-opportunities/requirements/opportunity-requirement-pagination.spec.ts
          src/meri/meri-data-search.helpers.spec.ts
          src/meri/meri-research
          src/meri/governed-meri-research.factory.spec.ts
          src/meri/meri-v3-research-runner.spec.ts
          src/meri/meri-compaction.helpers.spec.ts
          src/meri/meri-summary-completion.spec.ts
          src/meri/meri-turn-maintenance.spec.ts
          src/meri/meriv3-proxy.service.spec.ts
          src/meri/meri-context-plane.service.spec.ts
          src/meri/meri-context-evidence-projection.spec.ts
          src/meri/meri-document-read.helpers.spec.ts
          src/meri/meri-memory-content.helpers.spec.ts
          src/meri/meri-memory-context.integration.spec.ts
          src/meri/meri-tool-request-control.spec.ts
          src/meri/meri-strategy-context.integration.spec.ts
          src/retrieval/retrieval-adapter-registry.spec.ts
          src/retrieval/retrieval-v2.service.spec.ts
          src/retrieval/adapters/public-domain-retrieval.adapter.spec.ts
          src/retrieval/adapters/public-bill-read.service.spec.ts
          src/retrieval/adapters/government-work-retrieval.spec.ts
          src/retrieval/adapters/district-nexus-retrieval.adapter.spec.ts
          src/retrieval/adapters/strategy-work-retrieval.adapter.spec.ts
          src/retrieval/adapters/institutional-knowledge-retrieval.adapter.spec.ts

      - name: Test document section extraction
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: >
          pnpm --filter @capiro/api exec jest
          --runInBand --forceExit
          src/engagement/attachment-section-extract.spec.ts
          src/engagement/engagement-document-read.spec.ts
          src/engagement/attachment-pdf-vision.spec.ts
          src/embeddings/client-kb-readability.spec.ts
          src/engagement/llm-completion.service.spec.ts
          src/engagement/llm-completion-streaming.service.spec.ts
          src/meri/meri-attachment-extract.spec.ts

      - name: Test core evidence and cancellation contracts
        run: >
          pnpm --filter @capiro/meriv2-core exec jest
          --runInBand --forceExit
          src/context/governed-evidence-auth.spec.ts
          src/registry/tool-registry.spec.ts
          src/tools/client/get-client-context.spec.ts
          src/tools/delegated/delegated-tool.spec.ts

      - name: Test popup workspace, launcher and connected apps
        run: >
          pnpm --filter @capiro/web exec vitest run
          src/components/chat/MeriOverlay.test.tsx
          src/components/chat/meri-runtime-status.test.ts
          src/components/chat/MeriWorkspaceWindow.test.tsx
          src/components/chat/meri-window.test.ts
          src/components/chat/ManagedComposerPlus.test.tsx
          src/components/chat/managed-mcp-apps.test.tsx
          src/components/chat/useMeriChatController.feedback-identity.test.tsx
          src/components/chat/useMeriChatController.research-recovery.test.tsx
          src/vnext/meri/MeriEvidenceTab.coverage.test.tsx
          src/vnext/meri/MeriEvidenceTab.citations.test.tsx
          src/vnext/meri/MeriThinkingTab.runtime.test.tsx
          src/vnext/meri/MeriTurnCoverage.test.tsx
          src/vnext/pages/client-crm/tabs/file-readability.test.ts
          src/vnext/meri/MeriResearchRecovery.test.tsx
          src/vnext/meri/VNextMeriReasoningControl.test.tsx
          src/components/chat/useMeriChatController.rename-persistence.test.tsx
          src/vnext/meri/VNextMeriComposer.drafts-import.test.tsx
          src/vnext/meri/VNextMeriMessage.work-performed.test.tsx
          src/vnext/meri/meri-install.test.ts
          src/vnext/meri/meri-pwa.contract.test.ts
          src/vnext/meri/meri-route-state.test.ts
          src/vnext/meri/meri-route-identity.test.tsx
          src/vnext/meri/meri-workspace-import.test.ts
          --testTimeout=20000 --hookTimeout=20000

      - name: Boundary guard — adjacent runtimes remain independent
        run: |
          set -e
          if grep -Rin "meriv3" apps/workspace/src apps/api-strategy/src apps/intel-api/src --include='*.ts' --include='*.tsx'; then
            echo "MeriV3 must not be imported into Workspace, Strategy or intel-api during the chat canary."
            exit 1
          fi
          if grep -Ein "type:[[:space:]]*['\"](thinking|reasoning)['\"]" \
            apps/meriv2-orchestrator/src/meri/meriv3/meriv3.controller.ts \
            apps/meriv2-orchestrator/src/meri/meriv3/meriv3-assistant.service.ts \
            apps/api/src/meri/meriv3-proxy.service.ts; then
            echo "MeriV3 must not expose raw reasoning/thinking SSE events."
            exit 1
          fi
          if grep -Rin "sharepoint" \
            apps/api/src/meri/meri-managed-mcp* \
            apps/meriv2-orchestrator/src/meri/meriv3/api-managed-mcp.repo.ts \
            apps/web/src/components/chat/ManagedComposerPlus.tsx \
            apps/web/src/components/chat/managed-mcp-apps.tsx; then
            echo "This managed-app release must not surface SharePoint."
            exit 1
          fi
          echo "MeriV3 isolation, reasoning-redaction, and managed-app scope guards passed."

      - name: Build MeriV3 deployables
        run: |
          pnpm --filter @capiro/meriv2-orchestrator build
          pnpm --filter @capiro/api build
          pnpm --filter @capiro/web build
