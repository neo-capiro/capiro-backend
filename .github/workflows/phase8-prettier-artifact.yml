name: phase8-prettier-artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-phase8:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 8 files without modifying the branch
        run: |
          pnpm exec prettier --write \
            packages/meriv2-core/src/context/context-release-switch.spec.ts \
            packages/meriv2-core/src/context/context-release-switch.ts \
            packages/meriv2-core/src/context/context-rollout.spec.ts \
            packages/meriv2-core/src/context/context-rollout.ts \
            apps/meriv2-orchestrator/src/meri/context-compiler.service.ts
          tar -czf phase8-prettier.tar.gz \
            packages/meriv2-core/src/context/context-release-switch.spec.ts \
            packages/meriv2-core/src/context/context-release-switch.ts \
            packages/meriv2-core/src/context/context-rollout.spec.ts \
            packages/meriv2-core/src/context/context-rollout.ts \
            apps/meriv2-orchestrator/src/meri/context-compiler.service.ts
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-prettier
          path: phase8-prettier.tar.gz
          if-no-files-found: error
          retention-days: 1
