# Legacy filename retained. This workflow builds only; it does not promote.
name: web-vnext-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/public/meri-icons/**'
      - 'apps/web/public/meri-manifest.json'
      - 'apps/web/src/main.tsx'
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/vnext/**'
      - 'apps/web/src/pages/intelligence/district-nexus/**'
      - 'apps/web/src/components/chat/**'
      - 'apps/web/src/env.ts'
      - 'apps/web/nginx/**'
      - 'apps/web/Dockerfile'
      - 'apps/web/vite.config.ts'
      - 'packages/shared/**'
      - 'packages/strategy-verifier/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-vnext-deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: web-vnext-dev-build
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EXPECTED_ECR_REPOSITORY: capiro/dev/web-vnext

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @capiro/shared build

      - name: Build strategy verifier
        run: pnpm --filter @capiro/strategy-verifier build

      - name: Run vNext focused tests
        run: >-
          pnpm --filter @capiro/web exec vitest run
          src/vnext/app/presentation.test.ts
          src/vnext/foundation-contract.test.ts
          src/vnext/figma-strategy-legiwatch-contract.test.ts
          src/vnext/meri/meri-install.test.ts
          src/vnext/meri/meri-pwa.contract.test.ts
          src/vnext/meri/meri-route-state.test.ts
          --poolOptions.threads.singleThread

      - name: Typecheck web
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @capiro/web typecheck

      - name: Build web
        env:
          # Match the Docker build budget: Rollup chunk rendering exceeds
          # Node's default heap before the image/deploy steps can run.
          NODE_OPTIONS: --max-old-space-size=6144
          CAPIRO_WEB_BUILD_SURFACE: vnext
        run: pnpm --filter @capiro/web build

      - name: Validate build isolation
        run: python3 scripts/validate-meri-build-isolation.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push isolated vNext image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          no-cache-filters: build
          build-args: |
            GIT_SHA=${{ github.sha }}
            CAPIRO_WEB_BUILD_SURFACE=vnext
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.EXPECTED_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=web-vnext
          cache-to: type=gha,mode=max,scope=web-vnext

      - name: Record candidate digest (not promoted)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "Candidate: $REGISTRY/$EXPECTED_ECR_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA — build publication only; qualification and approval still required." >> "$GITHUB_STEP_SUMMARY"
