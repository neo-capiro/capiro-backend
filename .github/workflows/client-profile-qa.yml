name: client-profile-qa

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/clients/**'
      - 'apps/intel-api/src/tracker/**'
      - 'apps/intel-api/test/tracker-*.spec.ts'
      - 'apps/web/src/pages/intelligence/opportunities/**'
      - 'apps/web/src/pages/clients/facilities-api.ts'
      - 'apps/web/src/vnext/pages/client-crm/**'
      - 'apps/web/src/vnext/adapters/legacy/useShellClientContext.ts'
      - 'apps/web/src/vnext/pages/strategies/StrategyLibraryVNext*'
      - 'apps/web/src/vnext/pages/strategies/ScopeBar.tsx'
      - 'apps/web/src/vnext/pages/funding-opportunities/**'
      - 'apps/web/src/vnext/pages/portfolio/**'
      - 'packages/shared/**'
      - 'packages/strategy-verifier/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/client-profile-qa.yml'

permissions:
  contents: read

jobs:
  q10-q12:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: client_profile_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d client_profile_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build runtime dependencies
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/auth build
          pnpm --filter @capiro/meriv2-core build
          pnpm --filter @capiro/strategy-verifier build
      - name: Generate API clients
        run: |
          pnpm --filter @capiro/api exec prisma generate
          pnpm --filter @capiro/intel-api exec prisma generate
      - name: Opportunity rendering, review and portfolio regression tests
        run: >
          pnpm --filter @capiro/web exec vitest run
          src/pages/intelligence/opportunities/opportunity-description.test.tsx
          src/vnext/pages/funding-opportunities/FundingOpportunityBrowse.test.tsx
          src/vnext/pages/client-crm/ClientFillWithMeriDrawer.review.test.tsx
          src/vnext/pages/portfolio/PortfolioIndexPage.test.tsx
          src/vnext/pages/client-crm/tabs/RelationshipsHistoryTab.test.tsx
          src/vnext/pages/client-crm/tabs/FilesTab.test.tsx
          src/vnext/pages/client-crm/tabs/WorkTab.test.tsx
          src/vnext/pages/client-crm/tabs/AdvocacyMattersTab.test.tsx
          src/vnext/pages/client-crm/FacilityVerification.test.tsx
          src/vnext/pages/client-crm/ManageFacilitiesModal.test.tsx
          src/vnext/pages/client-crm/tabs/IntelligenceTab.test.tsx
          src/vnext/pages/client-crm/client-crm-routing.test.ts
          src/vnext/pages/strategies/StrategyLibraryVNext.client-navigation.test.tsx
          --poolOptions.threads.singleThread
      - name: Fill retry orchestration and timeout regression tests
        env:
          FILL_RETRY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/client_profile_qa
        run: >
          pnpm --filter @capiro/api exec jest --runInBand
          src/clients/client-profile-fill-retry.spec.ts
          src/clients/client-profile-fill-retry.integration.spec.ts
      - name: Tracker counts and pagination regression tests
        run: >
          pnpm --filter @capiro/intel-api exec jest --runInBand
          test/tracker-portfolio-counts.spec.ts test/tracker-board-pagination.spec.ts
