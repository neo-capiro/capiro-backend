name: ci-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  phase3:
    if: github.event.pull_request.head.ref == 'agent/meriv2-world-class-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm synchronized moving baseline
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          if grep -q "async proposeSettingsSections" apps/api/src/memory/memory-candidate.service.ts; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "Phase 3 source is already present; this follow-up run will not mutate or push."
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.state.outputs.apply == 'true'
      - uses: actions/setup-node@v4
        if: steps.state.outputs.apply == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Apply the reviewed Phase 3 patch
        if: steps.state.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp/meriv2-phase3-apply.py')
          text = path.read_text()
          text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)
          old = '''def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))
          '''
          new = '''def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              lines = old.splitlines(keepends=True)
              pattern = ''.join(r'[ \\t]*' + re.escape(line.lstrip(' \\t')) for line in lines)
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text[:match.start()] + new + text[match.end():])
          '''
          if old not in text:
              raise SystemExit('replace helper anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python scripts/tmp/meriv2-phase3-apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/memory/memory-canonical-activation.helpers.ts')
          text = path.read_text()
          text = text.replace("ARRAY['memory-file', ${record.scope}], 'manual'", "ARRAY['memory', ${record.source}], 'manual'")
          path.write_text(text)
          PY
          forbidden=$(git diff --name-only | grep -E '(^|/)(program-element|defense-budget|program_element|pe-)' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Phase 3 unexpectedly changed Program Element paths"
            echo "$forbidden"
            exit 1
          fi

      - name: Install locked dependencies
        if: steps.state.outputs.apply == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate all Prisma clients
        if: steps.state.outputs.apply == 'true'
        run: |
          pnpm --filter @capiro/api exec prisma generate
          pnpm --filter @capiro/api-strategy exec prisma generate
          pnpm --filter @capiro/intel-api exec prisma generate
          pnpm --filter @capiro/onboard-api exec prisma generate
          pnpm --filter @capiro/workspace exec prisma generate

      - name: Build internal dependencies
        if: steps.state.outputs.apply == 'true'
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/auth build
          pnpm --filter @capiro/strategy-verifier build
          pnpm --filter @capiro/meriv2-core build

      - name: Format Phase 3 files
        if: steps.state.outputs.apply == 'true'
        run: |
          pnpm exec prettier --write \
            apps/api/src/memory/memory-candidate.service.ts \
            apps/api/src/memory/memory-canonical-activation.helpers.ts \
            apps/api/src/memory/memory-canonical-activation.helpers.spec.ts \
            apps/api/src/memory/memory.controller.ts \
            apps/api/src/memory/memory.controller.settings-review.spec.ts \
            apps/web/src/components/MemoryFileEditor.tsx \
            apps/web/src/components/MemoryFileEditor.phase3.test.ts

      - name: API and Program Element safety typecheck
        if: steps.state.outputs.apply == 'true'
        run: pnpm --filter @capiro/api typecheck

      - name: Web typecheck
        if: steps.state.outputs.apply == 'true'
        run: pnpm --filter @capiro/web typecheck

      - name: Phase 3 API regression matrix
        if: steps.state.outputs.apply == 'true'
        run: |
          pnpm --filter @capiro/api exec jest --runInBand --forceExit \
            src/memory/memory.controller.settings-review.spec.ts \
            src/memory/memory-canonical-activation.helpers.spec.ts \
            src/memory/memory-candidate.atomicity.spec.ts \
            src/memory/memory-candidate.approval.spec.ts \
            src/memory/memory.controller.governance.spec.ts

      - name: Phase 3 web result contract
        if: steps.state.outputs.apply == 'true'
        run: pnpm --filter @capiro/web exec vitest run src/components/MemoryFileEditor.phase3.test.ts --testTimeout=20000 --hookTimeout=20000

      - name: Reconfirm main before promotion
        if: steps.state.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          latest=$(git rev-parse origin/main)
          test "$latest" = "${{ steps.state.outputs.main_sha }}"
          git merge-base --is-ancestor origin/main HEAD

      - name: Promote validated Phase 3 implementation
        if: steps.state.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name codex
          git config user.email 267193182+codex@users.noreply.github.com
          git add \
            apps/api/src/memory/memory-candidate.service.ts \
            apps/api/src/memory/memory-canonical-activation.helpers.ts \
            apps/api/src/memory/memory-canonical-activation.helpers.spec.ts \
            apps/api/src/memory/memory.controller.ts \
            apps/api/src/memory/memory.controller.settings-review.spec.ts \
            apps/web/src/components/MemoryFileEditor.tsx \
            apps/web/src/components/MemoryFileEditor.phase3.test.ts
          git diff --cached --check
          git commit -m "feat(meriv2): review-gate Settings shared memory"
          git push origin HEAD:agent/meriv2-world-class-closeout
          echo "Promoted $(git rev-parse HEAD)"
