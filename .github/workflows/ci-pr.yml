name: ci-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  phase3-evidence:
    if: github.event.pull_request.head.ref == 'agent/meriv2-world-class-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
          persist-credentials: true

      - name: Promote reviewed Phase 3 evidence and restore normal CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/meriv2-phase3-evidence.yml').read_text()
          marker = '        run: |\n'
          if marker not in source:
              raise SystemExit('Phase 3 evidence run block not found')
          block = source.split(marker, 1)[1]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          needle = 'git rm .github/workflows/meriv2-phase3-evidence.yml\n'
          replacement = (
              needle
              + 'git checkout origin/main -- .github/workflows/ci-pr.yml\n'
              + 'git add .github/workflows/ci-pr.yml\n'
          )
          if needle not in script:
              raise SystemExit('Phase 3 evidence cleanup anchor not found')
          Path('/tmp/record-phase3-evidence.sh').write_text(script.replace(needle, replacement, 1))
          PY
          bash /tmp/record-phase3-evidence.sh
