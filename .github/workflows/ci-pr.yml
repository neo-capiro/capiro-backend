# PR gate (SC0.6). Runs on every pull request to main. Lint is intentionally
# substituted with `prettier --check` on the MeriV2 code: `pnpm lint` is
# non-functional repo-wide (eslint is not installed), so typecheck + prettier +
# tests are the real quality gate (see docs/plans/2026-06-30-meriv2-DECISIONS.md D3).
name: ci-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No `version:` — pnpm/action-setup reads it from package.json
      # `packageManager` (pnpm@9.12.0); pinning both errors with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Supply-chain (blocker #4): advisory dependency audit. `|| true` keeps it
      # NON-blocking for now — it surfaces known high/critical CVEs in the PR log
      # without failing the gate on pre-existing transitive advisories. Once the
      # baseline is triaged, drop `|| true` (and/or add `--prod`) to make it a
      # hard gate. Runs after install so the full resolved lockfile is audited.
      - name: Dependency audit (advisory)
        run: pnpm audit --audit-level=high || true

      # The api + workspace typecheck/tests import their generated Prisma
      # clients; generate them before turbo runs (the image builds do this
      # inside Docker, but this direct CI job must do it explicitly). `generate`
      # does not connect to a DB, so no DATABASE_URL is needed.
      - name: Generate Prisma clients
        run: |
          pnpm --filter @capiro/api exec prisma generate
          pnpm --filter @capiro/workspace exec prisma generate
          pnpm --filter @capiro/intel-api exec prisma generate
          pnpm --filter @capiro/onboard-api exec prisma generate
          pnpm --filter @capiro/api-strategy exec prisma generate

      - name: Prettier (MeriV2 + shared core)
        # W5.7: packages/shared is now gated — it holds the deterministic engines
        # the whole platform depends on (deriveBillStatus / deriveStateBillStatus,
        # deriveRuleLifecycleStage, isRuleCommentOpen, MERI_TOOL_MANIFEST, funding
        # precedence). A blanket apps/api / apps/intel-api / apps/web check is
        # intentionally NOT added here: those trees carry pre-existing formatting
        # debt OUTSIDE the state platform (e.g. engagement/outreach files), and a
        # blanket check would break CI on unrelated files (G7: never touch
        # unrelated pre-existing debt). State-platform code in apps/api is
        # formatted file-by-file at authorship; a repo-wide changed-files gate is
        # a separate follow-up once the apps/* debt is paid down.
        run: >
          pnpm exec prettier --check
          "packages/meriv2-core/**/*.ts"
          "apps/meriv2-orchestrator/**/*.ts"
          "packages/shared/**/*.ts"

      # BYOK4 guard: no MeriV2 code may read the global Anthropic key directly.
      # The ONLY permitted reference is the orchestrator's resolver wiring
      # (meri-registry.service.ts injects the env fallback into
      # RequestScopedLlmClient) and its specs. packages/meriv2-core must have
      # ZERO references. This is what keeps "every MeriV2 LLM call is
      # tenant-scoped" true after the initial conversion.
      - name: BYOK guard (no direct Anthropic env keys in MeriV2 surfaces)
        run: |
          set -e
          violations=$(grep -rn "ANTHROPIC_API_KEY" \
            packages/meriv2-core/src \
            apps/meriv2-orchestrator/src \
            --include='*.ts' \
            | grep -v "apps/meriv2-orchestrator/src/meri/meri-registry.service.ts" \
            | grep -v "\.spec\.ts:" \
            || true)
          if [ -n "$violations" ]; then
            echo "BYOK violation — direct ANTHROPIC_API_KEY reference outside the resolver:"
            echo "$violations"
            exit 1
          fi
          echo "BYOK guard passed."

      # Typecheck every package, api INCLUDED. The prior `@jest/globals`
      # resolution failure in api spec files is resolved — `tsc --noEmit` is now
      # clean across the whole api project, spec files included — so the
      # exclusion is dropped and every PR type-gates apps/api directly, not just
      # via the slower image build. (Follow-up: add an apps/api jest step; that
      # needs a CI Postgres service since much of the api suite is DB-backed.)
      - name: Typecheck (turbo)
        run: pnpm turbo run typecheck

      # Unit tests for the new orchestrator core (DB-free). The api/workspace
      # suites need a live Postgres and run via their own image/e2e paths; the
      # cross-client-leakage + grounding gate is meriv2-evals.yml.
      - name: Test meriv2-core
        run: pnpm --filter @capiro/meriv2-core test

      # meriv2-orchestrator's own suite (registry wiring, delegated-tool
      # catalogs, in-editor loop, write-tool gate proof) is ALSO DB-free — every
      # I/O boundary (apps/api tool calls, the Anthropic API) is mocked at the
      # fetch layer. Previously untested in CI: this workflow ran typecheck for
      # the whole repo but only ever unit-tested meriv2-core, so a regression in
      # the orchestrator's own logic (e.g. a write tool silently bypassing the
      # approval gate) would type-check clean and still merge.
      - name: Test meriv2-orchestrator
        run: pnpm --filter @capiro/meriv2-orchestrator test

      # @capiro/auth — the shared Clerk-verify guard (auth-extraction Option N).
      # DB-free unit suite: guard 401/403 matrix + v1/v2 claims normalization.
      # An auth regression here would gate every orchestrator/workspace route.
      - name: Test auth package
        run: pnpm --filter @capiro/auth test

      # @capiro/api-strategy — Strategy Planner engine (G1 scaffold). The
      # DB-free specs run here: fiscal calendar, reference baseline builder +
      # payload validator, and the tenant-scope leak guard (static: greps src
      # for bare tenant-scoped Prisma access). The DB-backed
      # tenant-isolation.int-spec self-skips without DATABASE_URL (it runs in
      # the image/e2e path), so the full `test` is safe here.
      - name: Test api-strategy
        run: pnpm --filter @capiro/api-strategy test

      # Engagement API Phase 1 — local-runtime contract. Runs the DB-free
      # verifier (runtime policy, route coverage, timer containment, external
      # boundaries, app module, bootstrap, health, entrypoint tests) and
      # the API build that produces both dist/main.js and dist/engagement-main.js.
      # Does NOT connect to a database, call AWS, or call any external provider.
      - name: Engagement API Phase 1 local-runtime contract
        run: pnpm verify:engagement-phase-1
