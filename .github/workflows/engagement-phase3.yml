name: engagement-phase3

on:
  push:
    branches:
      - agent/engagement-api-phase-3-full-ui-parity
  pull_request:
    branches:
      - main
      - agent/engagement-api-phase-2-dark-fargate
    paths:
      - 'apps/api/src/engagement/**'
      - 'apps/api/scripts/*engagement-phase3*'
      - 'apps/web/src/lib/*engagement*preview*'
      - 'apps/web/src/pages/engagement/**'
      - 'apps/web/src/pages/settings/IntegrationsPage.tsx'
      - 'apps/web/scripts/engagement-phase3-*'
      - 'scripts/*engagement-phase3*'
      - 'docs/plans/engagement-api/**'
      - 'docs/contracts/engagement-*'
      - 'package.json'
      - '.github/workflows/engagement-phase3.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  db-free:
    name: Phase 3 DB-free closeout
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PHASE3_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PHASE3_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact Phase 3 head checkout
        run: test "$(git rev-parse HEAD)" = "$PHASE3_HEAD_SHA"

      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${PHASE3_HEAD_SHA}" \
            -d "$(jq -nc --arg target_url "$TARGET_URL" '{state:"pending",context:"engagement-phase3/db-free",description:"Phase 3 DB-free verifier is running",target_url:$target_url}')"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @capiro/api exec prisma generate

      - name: Phase 3 permanent DB-free verifier and diff hygiene
        id: phase3_gate
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm verify:engagement-phase-3
          git diff --check
          test -z "$(git status --short)"

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE3_OUTCOME: ${{ steps.phase3_gate.outcome }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PHASE3_OUTCOME" = "success" ]; then
            STATE=success
            DESCRIPTION="Phase 3 DB-free verifier passed"
          else
            STATE=failure
            DESCRIPTION="Phase 3 DB-free verifier failed"
          fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${PHASE3_HEAD_SHA}" \
            -d "$(jq -nc --arg state "$STATE" --arg description "$DESCRIPTION" --arg target_url "$TARGET_URL" '{state:$state,context:"engagement-phase3/db-free",description:$description,target_url:$target_url}')"

      - name: Fail workflow when Phase 3 gate failed
        if: steps.phase3_gate.outcome != 'success'
        run: exit 1
