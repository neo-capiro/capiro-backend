name: MeriV2 Phase 3 evidence promotion

on:
  push:
    branches:
      - agent/meriv2-world-class-closeout
    paths:
      - .github/workflows/meriv2-phase3-evidence.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm moving baseline and record Phase 3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" = "057f5480a46f9ba9acf9296a9cc876b609593832"

          log=docs/plans/meriv2-world-class-closeout-work-log.md
          if ! grep -q '^## Phase 3 — Settings shared-memory review lifecycle' "$log"; then
            cat >> "$log" <<'EOF'

## Phase 3 — Settings shared-memory review lifecycle (2026-07-30)

### Current baseline and implementation

- Current `main` at implementation, promotion, and acceptance: `057f5480a46f9ba9acf9296a9cc876b609593832`.
- The closeout branch was **0 commits behind** before promotion and again before the acceptance record.
- Runtime implementation commit: `51bcb642851bbfcdc452908c94a830afd6a07733`.
- Validation fixture repair: `85cba12fd745485135213d8fbe6f6dea8a77be74`.
