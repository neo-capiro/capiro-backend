name: phase9-apply

on:
  pull_request:
    branches: [main]
    paths:
      - docs/tmp/apply-meriv2-phase9.py
      - docs/tmp/fix-and-run-meriv2-phase9.py
      - .github/workflows/phase9-apply.yml
  push:
    branches: [agent/meriv2-world-class-closeout]
    paths:
      - docs/tmp/apply-meriv2-phase9.py
      - docs/tmp/fix-and-run-meriv2-phase9.py

permissions:
  contents: write

jobs:
  apply-phase9-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
      - name: Apply reviewed Phase 9 changes
        run: |
          git config user.name "capiro-phase9-bot"
          git config user.email "noreply@capiro.ai"
          python docs/tmp/fix-and-run-meriv2-phase9.py
          rm docs/tmp/fix-and-run-meriv2-phase9.py
          rm docs/tmp/apply-meriv2-phase9.py
          rm docs/tmp/meriv2-phase9.patch
          rm .github/workflows/phase9-apply.yml
          git add -A
          git commit -m "feat(meriv2): make governed status authoritative for v2 recall"
          git push origin HEAD:agent/meriv2-world-class-closeout
