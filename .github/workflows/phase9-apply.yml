name: phase9-apply

on:
  pull_request:
    branches: [main]
    paths:
      - docs/tmp/apply-meriv2-phase9-followup.py
      - .github/workflows/phase9-apply.yml
  push:
    branches: [agent/meriv2-world-class-closeout]
    paths:
      - docs/tmp/apply-meriv2-phase9-followup.py

permissions:
  contents: write

jobs:
  apply-phase9-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
      - name: Apply reviewed Phase 9 stale-health followup
        run: |
          git config user.name "capiro-phase9-bot"
          git config user.email "noreply@capiro.ai"
          python docs/tmp/apply-meriv2-phase9-followup.py
          rm docs/tmp/apply-meriv2-phase9-followup.py
          git add -A
          git commit -m "fix(meriv2): preserve stale lifecycle health through rollout"
          git push origin HEAD:agent/meriv2-world-class-closeout
