name: phase9-workspace-harness-fix

on:
  pull_request:
    branches: [main]
    paths:
      - docs/tmp/apply-meriv2-phase9-workspace-harness-fix.py
      - .github/workflows/phase9-workspace-harness-fix.yml

permissions:
  contents: write

jobs:
  apply-workspace-harness-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
      - name: Apply Workspace tagged-template harness fix
        run: |
          git config user.name "capiro-phase9-bot"
          git config user.email "noreply@capiro.ai"
          python docs/tmp/apply-meriv2-phase9-workspace-harness-fix.py
          rm docs/tmp/apply-meriv2-phase9-workspace-harness-fix.py
          git add \
            apps/workspace/src/generation/context-compiler.canonical-memory.spec.ts \
            docs/tmp/apply-meriv2-phase9-workspace-harness-fix.py
          git commit -m "test(meriv2): inspect Workspace governed SQL interpolation"
          git push origin HEAD:agent/meriv2-world-class-closeout
