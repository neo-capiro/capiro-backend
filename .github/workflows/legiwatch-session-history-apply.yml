name: legiwatch-session-history-apply

on:
  push:
    branches: [agent/legiwatch-audit-fixes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legiwatch-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-legiwatch-session-history-patches.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-legiwatch-session-history-patches.py
          rm .github/workflows/legiwatch-session-history-apply.yml
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/intel-api/src/hearing/hearing-session.service.ts \
            apps/intel-api/src/hearing/hearing.controller.ts \
            apps/intel-api/src/hearing/hearing-tenant-scoping.spec.ts \
            apps/web/src/lib/hearing-watch-api.ts \
            apps/web/src/pages/intelligence/HearingWatchPage.tsx \
            apps/web/src/pages/intelligence/HearingWatchPage.test.tsx \
            .github/workflows/legiwatch-ci.yml \
            scripts/apply-legiwatch-session-history-patches.py \
            .github/workflows/legiwatch-session-history-apply.yml
          git diff --cached --check
          git commit -m 'fix(legiwatch): paginate hearing session history'
          git push origin HEAD:agent/legiwatch-audit-fixes
