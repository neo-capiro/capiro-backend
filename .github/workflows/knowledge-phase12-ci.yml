name: Knowledge Plane Phase 12 CI

on:
  push:
    branches:
      - agent/knowledge-plane-phase-12-embedding-provider-abstraction
    paths:
      - 'apps/api/src/embeddings/**'
      - 'apps/api/src/memory/**'
      - 'apps/api/src/meri/**'
      - 'apps/api/src/retrieval/**'
      - 'apps/api/scripts/embed-backfill.ts'
      - 'apps/api/scripts/backfill-client-kb.ts'
      - 'apps/api/scripts/sync-congress.ts'
      - 'apps/api/scripts/sync-lda.ts'
      - 'apps/workspace/package.json'
      - 'apps/meriv2-orchestrator/package.json'
      - 'packages/meriv2-core/package.json'
      - 'docs/knowledge-plane/phase-12-embedding-provider-abstraction.md'
      - '.github/workflows/knowledge-phase12-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/src/embeddings/**'
      - 'apps/api/src/memory/**'
      - 'apps/api/src/meri/**'
      - 'apps/api/src/retrieval/**'
      - 'apps/api/scripts/embed-backfill.ts'
      - 'apps/api/scripts/backfill-client-kb.ts'
      - 'apps/api/scripts/sync-congress.ts'
      - 'apps/api/scripts/sync-lda.ts'
      - 'apps/workspace/package.json'
      - 'apps/meriv2-orchestrator/package.json'
      - 'packages/meriv2-core/package.json'
      - 'docs/knowledge-plane/phase-12-embedding-provider-abstraction.md'
      - '.github/workflows/knowledge-phase12-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch hygiene
        run: git diff --check HEAD^

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages consumed by @capiro/api
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/meriv2-core build

      - name: Validate and generate Prisma client
        # Validation/generation require a URL but do not connect to a database.
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused?schema=public
        run: |
          pnpm --filter @capiro/api exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @capiro/api exec prisma generate --schema prisma/schema.prisma

      - name: Reject duplicate shared-provider implementations
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD^)
          fi

          # Reject newly-added coupling. Existing cross-domain defaults and
          # historical fixtures remain visible baseline debt, but do not make
          # every unrelated PR fail this Phase 12 ownership gate.
          titan_literal_hits=$(git diff --unified=0 --no-ext-diff "$base...HEAD" -- \
            'apps/**' 'packages/**' 'scripts/**' \
            ':!apps/api/src/embeddings/titan-embedding.provider.ts' \
            | awk '
                /^diff --git / { path=$4; sub(/^b\//, "", path) }
                /^\+\+\+/ { next }
                /^\+[^+]/ && /amazon\.titan-embed-text-v2:0/ { print path ":" substr($0, 2) }
              ' || true)
          if [ -n "$titan_literal_hits" ]; then
            echo "Titan embedding model is coupled outside the provider adapter:" >&2
            echo "$titan_literal_hits" >&2
            exit 1
          fi

          direct_bedrock_hits=$(git grep -n -E '@aws-sdk/client-bedrock-runtime|new BedrockRuntimeClient|InvokeModelCommand' -- \
            'apps/api/src/embeddings/**' \
            'apps/api/src/memory/**' \
            'apps/api/src/meri/**' \
            'apps/api/src/retrieval/**' \
            'apps/api/scripts/embed-backfill.ts' \
            'apps/api/scripts/backfill-client-kb.ts' \
            'apps/api/scripts/sync-congress.ts' \
            'apps/api/scripts/sync-lda.ts' \
            ':!apps/api/src/embeddings/titan-embedding.provider.ts' \
            ':!apps/api/src/embeddings/embedding-provider.contract.spec.ts' || true)
          if [ -n "$direct_bedrock_hits" ]; then
            echo "Direct Bedrock embedding coupling remains outside the shared provider adapter:" >&2
            echo "$direct_bedrock_hits" >&2
            exit 1
          fi

          # Phase-12 audited legacy compatibility island: clio_memory.embedding is
          # a pre-existing 1536-dimension OpenAI space. Migrating/removing it here
          # would violate the no-re-embed/no-dimension-change acceptance rule and
          # alter default Meri recall. Freeze it to the two inherited runtime call
          # sites (+ config declaration) so no new direct provider coupling spreads.
          legacy_openai_hits=$(git grep -n -E 'api\.openai\.com/v1/embeddings|text-embedding-3-small' -- \
            'apps/api/src/**' 'apps/api/scripts/**' || true)
          unexpected_legacy_hits=$(printf '%s\n' "$legacy_openai_hits" | grep -v -E \
            '^(apps/api/src/meri/meri\.service\.ts|apps/api/src/memory/memory-candidate\.service\.ts|apps/api/src/config/config\.schema\.ts):' || true)
          if [ -n "$unexpected_legacy_hits" ]; then
            echo "New direct legacy OpenAI embedding coupling was introduced outside the grandfathered compatibility island:" >&2
            echo "$unexpected_legacy_hits" >&2
            exit 1
          fi

      - name: Provider contract and storage regressions
        run: |
          pnpm --filter @capiro/api exec jest --runInBand --forceExit \
            src/embeddings/embedding-provider.contract.spec.ts \
            src/embeddings/embedder.spec.ts

      - name: Existing embedding and memory regressions
        run: |
          pnpm --filter @capiro/api exec jest --runInBand --forceExit \
            src/embeddings/client-kb.helpers.spec.ts \
            src/memory/memory-ingest.helpers.spec.ts

      - name: Reject Phase 12 TypeScript errors
        shell: bash
        run: |
          set +e
          pnpm --filter @capiro/api exec tsc --noEmit --pretty false > /tmp/api-tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/api-tsc.log
          if grep -E 'src/embeddings/|scripts/embed-backfill\.ts|src/memory/memory-ingest\.service\.ts' /tmp/api-tsc.log; then
            echo "Phase 12 introduced TypeScript errors." >&2
            exit 1
          fi
          echo "Full API typecheck exit: $status (unrelated baseline errors, if any, are not attributed to Phase 12)."
