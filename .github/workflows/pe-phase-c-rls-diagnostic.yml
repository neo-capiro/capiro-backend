name: pe-phase-c-rls-diagnostic

on:
  pull_request:
    branches: [agent/pe-trust-phase-b]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pe-trust-phase-c
      - name: Locate Program Element watch schema and RLS definitions
        shell: bash
        run: |
          echo '=== files containing program_element_watch ==='
          rg -l -i 'program_element_watch' apps/api/prisma apps/api/src apps/api/scripts || true
          echo '=== migration context ==='
          rg -n -i -C 10 'program_element_watch' apps/api/prisma/migrations || true
          echo '=== schema context ==='
          rg -n -i -C 8 'model ProgramElementWatch|program_element_watch' apps/api/prisma/schema.prisma || true
          echo '=== generic RLS helpers/patterns ==='
          rg -n -i -C 3 'ENABLE ROW LEVEL SECURITY|FORCE ROW LEVEL SECURITY|CREATE POLICY|current_tenant_id\(\)|rls_bypass\(\)' apps/api/prisma/migrations | head -n 500 || true
