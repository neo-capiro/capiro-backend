# Builds the MeriV2 orchestrator container image and pushes it to ECR.
# Mirrors workspace-image.yml: build artifact only — `cdk deploy` runs
# interactively (and, per the revert plan, orchestrator infra is created
# out-of-band, never via a blind `cdk deploy Capiro-dev-Compute`).
#
# Auth uses OIDC -> assume the capiro-gha-* role (same role family as the API;
# its ecr-push policy must be extended to cover capiro/<env>/meriv2-orchestrator).
#
# Build context is the REPOSITORY ROOT (the Dockerfile installs the pnpm
# workspace + generates the Prisma client from the api schema).

name: meriv2-orchestrator-image

on:
  push:
    branches: [main]
    paths:
      - 'apps/meriv2-orchestrator/**'
      - 'packages/meriv2-core/**'
      - 'packages/shared/**'
      - 'apps/api/prisma/schema.prisma'
      - 'pnpm-lock.yaml'
      - '.github/workflows/meriv2-orchestrator-image.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target env (dev|staging|prod)'
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TARGET_ENV: ${{ github.event.inputs.env || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_ENV == 'prod' && vars.AWS_PROD_GHA_ROLE_ARN || vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/meriv2-orchestrator/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/meriv2-orchestrator:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/meriv2-orchestrator:latest
          no-cache-filters: build
          cache-from: type=gha,scope=meriv2-orchestrator
          cache-to: type=gha,mode=max,scope=meriv2-orchestrator

      - name: Output image digest
        run: echo "Pushed capiro/${TARGET_ENV}/meriv2-orchestrator:${GITHUB_SHA}"
