# Builds the Onboard API container image (API + onboard-web SPA) and pushes it
# to ECR. Mirrors intel-api-image.yml: build artifact only — infra is applied
# out-of-band (never via a blind `cdk deploy Capiro-dev-Compute`).
#
# Auth uses OIDC -> assume the capiro-gha-* role (its ecr-push policy must be
# extended to cover capiro/<env>/onboard-api).
#
# Build context is the REPOSITORY ROOT (the Dockerfile installs the pnpm
# workspace, generates the Prisma client from the onboard-api schema, and
# builds the onboard-web SPA into the image).

name: onboard-api-image

on:
  push:
    branches: [main]
    paths:
      - 'apps/onboard-api/**'
      - 'apps/onboard-web/**'
      - 'packages/auth/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/onboard-api-image.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Target env (dev|staging|prod)'
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TARGET_ENV: ${{ github.event.inputs.env || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_ENV == 'prod' && vars.AWS_PROD_GHA_ROLE_ARN || vars.AWS_DEV_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/onboard-api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/onboard-api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/capiro/${{ env.TARGET_ENV }}/onboard-api:latest
          no-cache-filters: build
          cache-from: type=gha,scope=onboard-api
          cache-to: type=gha,mode=max,scope=onboard-api

      - name: Output image digest
        run: echo "Pushed capiro/${TARGET_ENV}/onboard-api:${GITHUB_SHA}"
