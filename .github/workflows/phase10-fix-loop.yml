name: phase10-fix-loop

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase10-fix-loop.yml

permissions:
  contents: write

jobs:
  fix-phase10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add policy evidence to the orchestrator proposal fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/meriv2-orchestrator/src/meri/chat/chat-assistant.service.spec.ts')
          text = path.read_text()
          old = "    resultSummary: null,\n    createdAt:"
          new = """    resultSummary: null,
    policy: {
      source: 'persisted',
      mode: 'enforce',
      packKey: 'default',
      packVersion: '1',
      binding: 'binding-1',
      decisionHash: 'decision-hash-1',
      contextHash: 'context-hash-1',
      decision: 'WARN',
      jurisdiction: 'federal',
      channel: 'internal',
      recipientType: null,
    },
    createdAt:"""
          if old not in text:
              raise SystemExit('target proposal fixture was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/meriv2-orchestrator/src/meri/chat/chat-assistant.service.spec.ts
          pnpm --filter @capiro/meriv2-orchestrator typecheck
          git config user.name "capiro-phase10-bot"
          git config user.email "noreply@capiro.ai"
          git add apps/meriv2-orchestrator/src/meri/chat/chat-assistant.service.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(meriv2): bind policy evidence in chat proposal fixture"
          git push origin HEAD:agent/meriv2-world-class-closeout
