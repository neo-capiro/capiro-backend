name: phase10-fix-loop

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase10-fix-loop.yml

permissions:
  contents: write

jobs:
  fix-phase10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meriv2-world-class-closeout
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add policy evidence to the orchestrator proposal fixture
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('apps/meriv2-orchestrator/src/meri/chat/chat-assistant.service.spec.ts'); t=p.read_text(); old='    resultSummary: null,\\n    createdAt:'; new=\"    resultSummary: null,\\n    policy: {\\n      source: 'persisted',\\n      mode: 'enforce',\\n      packKey: 'default',\\n      packVersion: '1',\\n      binding: 'binding-1',\\n      decisionHash: 'decision-hash-1',\\n      contextHash: 'context-hash-1',\\n      decision: 'WARN',\\n      jurisdiction: 'federal',\\n      channel: 'internal',\\n      recipientType: null,\\n    },\\n    createdAt:\"; assert old in t, 'target proposal fixture was not found'; p.write_text(t.replace(old,new,1))"
          pnpm exec prettier --write apps/meriv2-orchestrator/src/meri/chat/chat-assistant.service.spec.ts
          pnpm --filter @capiro/meriv2-orchestrator typecheck
          git config user.name "capiro-phase10-bot"
          git config user.email "noreply@capiro.ai"
          git add apps/meriv2-orchestrator/src/meri/chat/chat-assistant.service.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(meriv2): bind policy evidence in chat proposal fixture"
          git push origin HEAD:agent/meriv2-world-class-closeout
