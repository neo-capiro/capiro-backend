name: Phase 8 Session 11 Product Integration

on:
  push:
    paths:
      - 'packages/defense-contracts/src/public/budget-lifecycle.ts'
      - 'packages/defense-contracts/src/public/budget-lifecycle-product-routes.ts'
      - 'packages/defense-domain/src/budget-lifecycle/schedule.ts'
      - 'packages/defense-domain/src/budget-lifecycle/index.ts'
      - 'apps/defense-api/src/app.module.ts'
      - 'apps/defense-api/src/budget-lifecycle-product/**'
      - 'apps/defense-api/scripts/run-review-resolution.mjs'
      - 'scripts/*phase8-session11*'
      - 'docs/defense-budget/phase8-session11-*'
      - 'docs/runbooks/defense-budget-lifecycle-product-v1.md'
      - '.github/workflows/phase8-session11-product-integration.yml'
  pull_request:
    paths:
      - 'packages/defense-contracts/src/public/budget-lifecycle.ts'
      - 'packages/defense-contracts/src/public/budget-lifecycle-product-routes.ts'
      - 'packages/defense-domain/src/budget-lifecycle/schedule.ts'
      - 'packages/defense-domain/src/budget-lifecycle/index.ts'
      - 'apps/defense-api/src/app.module.ts'
      - 'apps/defense-api/src/budget-lifecycle-product/**'
      - 'apps/defense-api/scripts/run-review-resolution.mjs'
      - 'scripts/*phase8-session11*'
      - 'docs/defense-budget/phase8-session11-*'
      - 'docs/runbooks/defense-budget-lifecycle-product-v1.md'
      - '.github/workflows/phase8-session11-product-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No provider credential, no AWS credential, and no schedule trigger is
    # set anywhere in this job. Every gate proves the read-only surface and
    # its tests; the review-resolution CLI is only ever run WITHOUT --commit
    # here, exactly like the disposable-DB rehearsal's own dry-run step.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Pin pnpm
        run: corepack prepare pnpm@9.12.0 --activate

      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile

      - name: Build shared defense packages
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/auth build
          pnpm --filter @capiro/defense-contracts build
          pnpm --filter @capiro/defense-domain build
          pnpm --filter @capiro/defense-client build

      - name: Product/read domain gate
        run: node scripts/test-phase8-session11-domain.mjs

      - name: defense-api typecheck and build
        run: |
          pnpm --filter @capiro/defense-api typecheck
          pnpm --filter @capiro/defense-api build

      - name: Budget-lifecycle query-service spec
        run: pnpm --filter @capiro/defense-api exec tsx --test src/budget-lifecycle-product/budget-lifecycle-query.service.spec.ts

      - name: Static product-integration gate
        run: node scripts/verify-phase8-session11.mjs

      - name: Authoritative apps/api Prisma validation and generation
        run: |
          pnpm --filter @capiro/api exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @capiro/api exec prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Defense Prisma validation
        run: pnpm --filter @capiro/defense-api prisma:validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Disposable Session 11 database rehearsal
        run: node scripts/verify-phase8-session11-db.mjs

      - name: Preserve accepted Session 2-10 boundaries
        env:
          PHASE8_SESSION4_REPLAY_EVIDENCE: docs/defense-budget/phase8-session4-fy27-replay-evidence.json
        run: |
          node scripts/verify-phase8-session2.mjs
          node scripts/verify-phase8-session3.mjs
          node scripts/verify-phase8-session3-admin-boundary.mjs
          node scripts/verify-phase8-session4.mjs --enforce-replay
          node scripts/verify-phase8-session5.mjs --enforce-provider-decision
          node scripts/verify-phase8-session6.mjs --enforce-corpus
          node scripts/verify-phase8-session7.mjs
          node scripts/verify-phase8-session8.mjs
          node scripts/verify-phase8-session9.mjs
          node scripts/verify-phase8-session10.mjs

      - name: Session 6-10 domain gates stay green
        run: |
          node scripts/test-phase8-session6-federal-funding-domain.mjs
          node scripts/test-phase8-session7-lifecycle-domain.mjs
          node scripts/test-phase8-session8-discovery-domain.mjs
          node scripts/test-phase8-session8-publisher-native-domain.mjs
          node scripts/test-phase8-session9-provider-domain.mjs
          node scripts/test-phase8-session10-schedule-domain.mjs

      - name: Session 7-10 control loops and runtime specs stay green
        run: |
          pnpm --filter @capiro/defense-api exec tsx --test src/budget-lifecycle/lifecycle-watcher.spec.ts
          pnpm --filter @capiro/defense-api exec tsx --test src/budget-lifecycle/discovery/live-discovery.spec.ts
          pnpm --filter @capiro/defense-api exec tsx --test src/program-elements/cross-domain/provider-runtime.spec.ts
          pnpm --filter @capiro/defense-api exec tsx --test src/budget-lifecycle/schedule/schedule-coordinator.spec.ts

      - name: Review-resolution CLI stays dry-run-safe (no --commit, no auth env)
        run: |
          if PHASE8_SESSION11_REVIEW_RESOLUTION_AUTHORIZED=true node apps/defense-api/scripts/run-review-resolution.mjs \
            --expected-source-id 00000000-0000-0000-0000-000000000000 --decision published \
            --note ci --actor-user-id 00000000-0000-0000-0000-000000000000 \
            --tenant-id 00000000-0000-0000-0000-000000000000 --commit; then
            echo "expected this to fail without a real database/row" >&2
            exit 1
          fi

      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
