name: Knowledge Plane Phase 13 CI

on:
  push:
    branches:
      - agent/knowledge-plane-phase-13-nvidia-reranking
    paths:
      - 'apps/api/src/reranking/**'
      - 'apps/api/src/retrieval/**'
      - 'docs/knowledge-plane/phase-13-nvidia-reranking.md'
      - '.github/workflows/knowledge-phase13-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/src/reranking/**'
      - 'apps/api/src/retrieval/**'
      - 'docs/knowledge-plane/phase-13-nvidia-reranking.md'
      - '.github/workflows/knowledge-phase13-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch hygiene
        run: git diff --check origin/main...HEAD

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages consumed by API
        run: |
          pnpm --filter @capiro/shared build
          pnpm --filter @capiro/meriv2-core build

      - name: Validate and generate Prisma client
        # Validation/generation require a URL but do not connect to a database.
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused?schema=public
        run: |
          pnpm --filter @capiro/api exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @capiro/api exec prisma generate --schema prisma/schema.prisma

      # One worker preserves sequential execution and recycles its heap between suites.
      - name: Phase 13 provider and boundary tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm --filter @capiro/api exec jest --maxWorkers=1 --workerIdleMemoryLimit=1GB --forceExit \
            src/reranking/nvidia-reranking.provider.spec.ts \
            src/reranking/reranking-provider.factory.spec.ts \
            src/retrieval/retrieval-reranker.service.spec.ts \
            src/retrieval/retrieval-v2-reranking.spec.ts \
            src/retrieval/reranking-architecture.contract.spec.ts

      - name: Retrieval and vector architecture regressions
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm --filter @capiro/api exec jest --maxWorkers=1 --workerIdleMemoryLimit=1GB --forceExit \
            src/retrieval/retrieval-v2.service.spec.ts \
            src/retrieval/retrieval-v2-exact-lexical.spec.ts \
            src/retrieval/coverage-manifest.spec.ts \
            src/retrieval/vector-storage-architecture.contract.spec.ts

      - name: Reject Phase 13 TypeScript errors
        shell: bash
        run: |
          set +e
          pnpm --filter @capiro/api exec tsc --noEmit --pretty false > /tmp/api-tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/api-tsc.log
          if grep -E 'src/reranking/|src/retrieval/retrieval-reranker|src/retrieval/retrieval-v2\.(service|types)|src/retrieval/retrieval\.module' /tmp/api-tsc.log; then
            echo "Phase 13 introduced TypeScript errors." >&2
            exit 1
          fi
          echo "Full API typecheck exit: $status (unrelated baseline errors, if any, are not attributed to Phase 13)."
