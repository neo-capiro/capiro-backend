LogTime yes
LogFile /var/log/clamav/clamd.log
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
DatabaseDirectory /var/lib/clamav
MaxThreads 2
MaxQueue 4
ReadTimeout 10
CommandReadTimeout 5
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 10000
AlertEncrypted yes
AlertExceedsMax yes
ConcurrentDatabaseReload no
SelfCheck 600
